function updateIntro3D(dt) {
  _introT += dt;
  var t = _introT, p = G.player;
  // Wake-up: eye height rises from the floor, gaze lifts from down.
  var wake = Math.min(1, t / 2.2);
  _eyeH = 0.75 + (C.EYE_H - 0.75) * wake;
  p.pitch = -0.55 * (1 - wake);
  _snapCamera();
  if (typeof updateIntroHUD === 'function') updateIntroHUD(t, C.INTRO_LEN);
  // t=1.5: emergency lights stutter on = the one-time map reveal.
  if (t >= 1.5 && !_introRevealDone) {
    _introRevealDone = true;
    if (typeof startMapReveal === 'function') startMapReveal();
  }
  // t=2.8: PA announcement (garbled) + subtitle.
  if (t >= 2.8 && !_introPAPlayed) {
    _introPAPlayed = true;
    if (typeof Sfx !== 'undefined' && Sfx.pa) Sfx.pa();
    if (typeof showPASubtitle === 'function') showPASubtitle();
  }
  if (t >= C.INTRO_LEN) _finishIntro();
}

function _finishIntro() {
  if (G.state !== 'INTRO') return;
  if (!_introRevealDone && typeof startMapReveal === 'function') startMapReveal();
  _introPending = false;
  _eyeH = C.EYE_H;
  G.player.pitch = 0;
  _snapCamera();
  if (typeof hideIntroHUD === 'function') hideIntroHUD();
  if (typeof hidePASubtitle === 'function') hidePASubtitle();
  G.state = 'PLAY';
}

// v3: note overlay helpers (owned by systems.js/audioui.js visuals).
function _closeNote3D() {
  G.noteOpen = -1;
  if (typeof hideNote === 'function') hideNote();
  if (typeof Sfx !== 'undefined' && Sfx.paper) Sfx.paper();
}

// ------------------------------------------------------------- Lab API --
// Shared lab-environment API. world.js loads first, so other workers call
// these guard-free. All original code; names must not be renamed.
var Lab = {
  // Emergency state: lerp nearest point light color toward #C0392B over
  // ~1.5 s, drop ambient 0.35 -> 0.2. Reverses when turned off.
  setHuntMode: function (on) {
    _huntTarget = on ? 1 : 0;
  },

  // HERO SHOT #1, idempotent: emergency lights stutter on for ~2.5 s (whole
  // facility snaps visible), then die one-by-one down the corridor away from
  // the player. Drives itself on its own clock. Called once by the systems
  // worker (startMapReveal) for the one-time start reveal.
  revealBeat: function () {
    if (_beatDone || _beatPhase !== 'idle' || !_labBuilt) return;
    _beatPhase = 'stutter';
    _beatT = 0; _beatAcc = 0;
  },

  // Cheap paper/dust lift puff at a floor position (hunt punctuation).
  // x, z are continuous TILE coords. No-op-safe.
  dustBurst: function (x, z) {
    if (!_labBuilt || !_burst) return;
    var wx = x * C.TILE3D, wz = z * C.TILE3D;
    var bp = _burst.geo.attributes.position.array;
    for (var i = 0; i < 48; i++) {
      var j = i * 3, a = _rand() * Math.PI * 2, r = _rand() * 0.9;
      bp[j] = wx + Math.cos(a) * r * 0.3;
      bp[j + 1] = 0.15 + _rand() * 0.25;
      bp[j + 2] = wz + Math.sin(a) * r * 0.3;
      _burstVel[j] = Math.cos(a) * r * 0.8;
      _burstVel[j + 1] = 0.6 + _rand() * 1.1;
      _burstVel[j + 2] = Math.sin(a) * r * 0.8;
    }
    _burst.geo.attributes.position.needsUpdate = true;
    _burstLife = _burstMax;
    _burst.mat.opacity = 0.5;
    _burstPts.visible = true;
  },
};

/* Echo Chamber 3D — creature.js
 * Creature AI + 3D form. Plain script, no modules.
 * References shared globals C, G, W3, Sfx (world.js / audioui.js own them).
 * AI functions are ported 1:1 from our 2D build (build/ai.js) — they operate
 * purely on tile coords over G.grid, which is identical in 3D. The AI block
 * below is behavior-identical to the 2D original (same numbers, same FSM).
 * buildCreatureMesh / syncCreatureMesh / checkCapture3D and the `Creature`
 * API are ORIGINAL 3D work implementing the "wrong human" design spec:
 * reveal ladder, amber eyes, 6 procedural animations, audio hooks, TAKEN.
 * Top-level const/function only.
 */

'use strict';

/* ---------------- pathfinding / sensing (ported from 2D ai.js) ---------------- */

// 4-directional BFS over floor tiles (G.grid[y][x] === 0).
// Returns array of [x,y] from the first step to the target (inclusive);
// null if the target is a wall / out of bounds / unreachable.
function bfsPath(sx, sy, tx, ty) {
  sx |= 0; sy |= 0; tx |= 0; ty |= 0;
  var W = C.W, H = C.H;
  if (tx < 0 || ty < 0 || tx >= W || ty >= H) return null;
  if (G.grid[ty][tx] !== 0) return null; // target is a wall
  if (sx === tx && sy === ty) return [];
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return null;
  if (G.grid[sy][sx] !== 0) return null; // start is a wall
  var prev = new Array(W * H).fill(-1);
  var start = sy * W + sx, goal = ty * W + tx;
  prev[start] = start;
  var q = [start];
  var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (q.length > 0) {
    var cur = q.shift();
    var cx = cur % W, cy = (cur / W) | 0;
    if (cur === goal) break;
    for (var d = 0; d < 4; d++) {
      var nx = cx + dirs[d][0], ny = cy + dirs[d][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      if (G.grid[ny][nx] !== 0) continue;
      var ni = ny * W + nx;
      if (prev[ni] !== -1) continue;
      prev[ni] = cur;
      q.push(ni);
    }
  }
  if (prev[goal] === -1) return null; // unreachable
  var path = [];
  var n = goal;
  while (n !== start) {
    path.push([n % W, (n / W) | 0]);
    n = prev[n];
  }
  path.reverse();
  return path;
}

// Dijkstra flood from (sx,sy): entering an open tile costs 1, a wall costs 2.
// Returns a 2D array [y][x] of cost; Infinity wherever cost > maxR.
function noiseFlood(sx, sy, maxR) {
  sx |= 0; sy |= 0;
  var W = C.W, H = C.H;
  var cost = [];
  for (var y = 0; y < H; y++) cost.push(new Array(W).fill(Infinity));
  if (sx < 0 || sy < 0 || sx >= W || sy >= H) return cost;
  cost[sy][sx] = 0;
  var open = [[0, sx, sy]]; // [cost, x, y]; open list, tiny grid
  var dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (open.length > 0) {
    var bi = 0;
    for (var i = 1; i < open.length; i++) {
      if (open[i][0] < open[bi][0]) bi = i;
    }
    var cur = open.splice(bi, 1)[0];
    var cc = cur[0], x = cur[1], yy = cur[2];
    if (cc !== cost[yy][x]) continue; // stale entry
    if (cc > maxR) continue;
    for (var d = 0; d < 4; d++) {
      var nx = x + dirs[d][0], ny = yy + dirs[d][1];
      if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue;
      var nc = cc + (G.grid[ny][nx] === 0 ? 1 : 2);
      if (nc < cost[ny][nx]) {
        cost[ny][nx] = nc;
        open.push([nc, nx, ny]);
      }
    }
  }
  for (var ay = 0; ay < H; ay++) {
    for (var ax = 0; ax < W; ax++) {
      if (cost[ay][ax] > maxR) cost[ay][ax] = Infinity;
    }
  }
  return cost;
}

// Bresenham line between tile centers; false if any wall tile lies
// strictly between the endpoints (endpoints themselves may be anything).
function hasLOS(ax, ay, bx, by) {
  ax |= 0; ay |= 0; bx |= 0; by |= 0;
  var dx = Math.abs(bx - ax), dy = Math.abs(by - ay);
  var sx = ax < bx ? 1 : -1, sy = ay < by ? 1 : -1;
  var err = dx - dy;
  var x = ax, y = ay;
  while (!(x === bx && y === by)) {
    var e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
    if (x === bx && y === by) break; // endpoint: don't test it
    if (y >= 0 && y < C.H && x >= 0 && x < C.W && G.grid[y][x] === 1) return false;
  }
  return true;
}

// Emit a noise event: flood from (tx,ty); if the creature's tile hears it,
// queue a stimulus and bump suspicion. Always adds a faint visual ring.
function emitNoise(tx, ty, radius, susp) {
  tx |= 0; ty |= 0;
  var flood = noiseFlood(tx, ty, radius);
  var c = G.creature;
  var cx = Math.floor(c.x), cy = Math.floor(c.y);
  if (cx >= 0 && cy >= 0 && cx < C.W && cy < C.H && flood[cy][cx] <= radius) {
    G.noises.push({ tx: tx, ty: ty, susp: susp });
    c.susp = Math.min(C.SUSP_MAX, Math.max(c.susp, susp));
    // Sonar pulse heard by the creature -> HUD "HEARD" flicker (render reads G.heardFlash)
    if (radius === C.SONAR_NOISE_R && susp === C.PULSE_SUSP) G.heardFlash = 1.2;
  }
  G.rings.push({ x: tx, y: ty, r: 0, maxR: radius, t: 0, dur: 0.6, kind: 'noise' });
}

/* ---------------- radios (ported from 2D ai.js) ---------------- */

// Each active radio ticks down; every RADIO_TICK_T seconds it emits a noise.
// t <= 0 -> battery dead, radio removed.
function updateRadios(dt) {
  for (var i = G.radios.length - 1; i >= 0; i--) {
    var r = G.radios[i];
    r.t -= dt;
    r.tick += dt;
    if (r.tick >= C.RADIO_TICK_T) {
      r.tick = 0;
      emitNoise(r.tx, r.ty, C.RADIO_TICK_R, C.RADIO_SUSP);
    }
    if (r.t <= 0) G.radios.splice(i, 1);
  }
}

/* ---------------- creature FSM (ported from 2D ai.js) ---------------- */

// v3: per-keycard escalation — each keycard makes the creature angrier.
// G.keys: 0 (calm) .. 3 (furious). Hunt speed +8%/+15%/+22%, LOOK shortens,
// SEARCH lengthens. Tuned so a competent player can still win.
function _escHuntTick() {
  var k = Math.min(3, G.keys || 0);
  var mult = [1, 1.08, 1.15, 1.22][k];
  return C.C_TICK_HUNT / mult;
}
function _escLookT() {
  var k = Math.min(3, G.keys || 0);
  return Math.max(0.6, 1.2 - 0.2 * k);
}
function _escSearchT() {
  var k = Math.min(3, G.keys || 0);
  return 4 + k;
}

// _enterHunt: vision or suspicion-max trigger. Sets suspicion to max so the
// hunt sticks, re-targets the player, sting + HUD counter on transition.
function _enterHunt() {
  var c = G.creature, p = G.player;
  c.cstate = 'HUNT';
  c.susp = C.SUSP_MAX;
  c.tgt = { x: Math.floor(p.x), y: Math.floor(p.y) };
  c.path = [];
  c.tickT = 0;
  c.lookT = 0;
  c.smashT = 0;
  c.stuckN = 0;
  Sfx.huntSting();
  G.timesSpotted++;
}

// _toSearch: give up and wander near the current point (v3: longer with escalation).
function _toSearch() {
  var c = G.creature;
  c.cstate = 'SEARCH';
  c.searchT = _escSearchT();
  c.path = [];
  c.lookT = 0;   // wander timer: repick immediately
  c.tickT = 0;
  c.smashT = 0;
  c.stuckN = 0;
}

// _setPath: try to path to (tx,ty). On failure runs the stuck failsafe:
// wait 0.5s and retry; after 3 failures give up -> SEARCH.
function _setPath(tx, ty) {
  var c = G.creature;
  var p = bfsPath(Math.floor(c.x), Math.floor(c.y), tx, ty);
  if (p === null) {
    c.stuckN++;
    c.lookT = 0.5; // stuck wait (lookT doubles as the wait timer outside LOOK/SEARCH)
    if (c.stuckN >= 3) {
      c.stuckN = 0;
      _toSearch();
    }
    return false;
  }
  c.stuckN = 0;
  c.path = p;
  return true;
}

function _radioIndexAt(x, y) {
  for (var i = 0; i < G.radios.length; i++) {
    if (G.radios[i].tx === x && G.radios[i].ty === y) return i;
  }
  return -1;
}

function _removeRadioAt(x, y) {
  var i = _radioIndexAt(x, y);
  if (i >= 0) G.radios.splice(i, 1);
}

function _ri(a, b) {
  return a + ((Math.random() * (b - a + 1)) | 0);
}

// ROAM waypoint: 90% from x>=5 (den region), else anywhere on floor.
function _pickWaypoint() {
  var c = G.creature;
  var cx = Math.floor(c.x), cy = Math.floor(c.y);
  var east = [], all = [];
  for (var y = 0; y < C.H; y++) {
    for (var x = 0; x < C.W; x++) {
      if (G.grid[y][x] !== 0) continue;
      if (x === cx && y === cy) continue;
      all.push([x, y]);
      if (x >= 5) east.push([x, y]);
    }
  }
  var pool = (Math.random() < 0.9 && east.length > 0) ? east : all;
  if (pool.length === 0) return;
  var w = pool[(Math.random() * pool.length) | 0];
  c.tgt = { x: w[0], y: w[1] };
  _setPath(w[0], w[1]);
}

// SEARCH wander: random nearby floor tile, repicked every 2s.
function _pickWander() {
  var c = G.creature;
  c.lookT = 2; // wander timer
  var cx = Math.floor(c.x), cy = Math.floor(c.y);
  for (var t = 0; t < 12; t++) {
    var x = cx + _ri(-3, 3), y = cy + _ri(-3, 3);
    if (x < 0 || y < 0 || x >= C.W || y >= C.H) continue;
    if (G.grid[y][x] !== 0) continue;
    if (x === cx && y === cy) continue;
    var p = bfsPath(cx, cy, x, y);
    if (p !== null && p.length > 0) {
      c.stuckN = 0;
      c.path = p;
      return;
    }
  }
  c.path = [];
}

// Called right after a step: arrival handling for INVESTIGATE.
function _afterStep() {
  var c = G.creature;
  if (c.cstate === 'INVESTIGATE' && c.tgt && c.path.length === 0) {
    if (_radioIndexAt(c.tgt.x, c.tgt.y) >= 0) {
      c.smashT = 1.5; // stand still and smash the radio
      return;
    }
    c.cstate = 'LOOK';
    c.lookT = _escLookT();
    c.tickT = 0;
  }
}

// One movement tick: HUNT re-paths every tick; others step along the path.
function _tickStep() {
  var c = G.creature, p = G.player;
  if (c.cstate === 'HUNT') {
    if (c.susp < C.SUSP_DROP) {
      c.tgt = { x: Math.floor(p.x), y: Math.floor(p.y) }; // last-known
      _toSearch();
      return;
    }
    _setPath(Math.floor(p.x), Math.floor(p.y));
  }
  // Stuck wait: do nothing while the 0.5s wait timer runs.
  if (c.cstate !== 'LOOK' && c.cstate !== 'SEARCH' && c.lookT > 0) return;
  if (c.path.length > 0) {
    var nxt = c.path.shift();
    c.x = nxt[0] + 0.5;
    c.y = nxt[1] + 0.5;
    _afterStep();
  } else if (c.cstate === 'ROAM') {
    _pickWaypoint();
  }
}

// Main per-frame creature update (called from gameLoop in PLAY).
function updateCreature(dt) {
  // During the TAKEN death cinematic the AI is frozen (presentation only —
  // the run is already over; live-play behavior is unchanged).
  if (typeof Creature !== 'undefined' && Creature.takenActive()) return;
  var c = G.creature, p = G.player;

  // 1. Consume the stimulus queue: keep the loudest (ties -> latest).
  var stim = null;
  for (var i = 0; i < G.noises.length; i++) {
    var n = G.noises[i];
    if (stim === null || n.susp >= stim.susp) stim = n;
  }
  G.noises.length = 0;

  // 2. Suspicion decay (faster while the player is hidden).
  var decay = p.hidden ? C.SUSP_DECAY_HIDDEN : C.SUSP_DECAY;
  c.susp = Math.max(0, c.susp - decay * dt);

  // 3. Vision check: dist <= VISION_R + Bresenham LOS -> instant HUNT.
  var dx = p.x - c.x, dy = p.y - c.y;
  var seen = Math.sqrt(dx * dx + dy * dy) <= C.VISION_R &&
    hasLOS(Math.floor(c.x), Math.floor(c.y), Math.floor(p.x), Math.floor(p.y));
  if (seen) {
    if (c.cstate !== 'HUNT') _enterHunt();
  } else if (c.cstate !== 'HUNT' && c.susp >= C.SUSP_HUNT) {
    _enterHunt();
  }

  // 4. Hearing -> INVESTIGATE (from ROAM) or re-target (louder stimulus).
  // A stimulus that is itself loud enough (>= INVESTIGATE) always triggers,
  // even if this frame's decay shaved suspicion just under the threshold.
  var heardLoud = stim !== null &&
    (c.susp >= C.SUSP_INVESTIGATE || stim.susp >= C.SUSP_INVESTIGATE);
  if (c.cstate === 'ROAM' && heardLoud) {
    c.cstate = 'INVESTIGATE';
    c.tgt = { x: stim.tx, y: stim.ty };
    c.tsusp = stim.susp;
    c.smashT = 0;
    c.tickT = 0;
    _setPath(stim.tx, stim.ty);
    if (c.path.length === 0) _afterStep(); // stimulus underfoot
    Sfx.chitter(); // first heard stimulus
  } else if (c.cstate === 'INVESTIGATE' && stim !== null &&
             stim.susp > (c.tsusp || 0) && c.smashT <= 0) {
    c.tgt = { x: stim.tx, y: stim.ty };
    c.tsusp = stim.susp;
    c.tickT = 0;
    _setPath(stim.tx, stim.ty);
    if (c.path.length === 0) _afterStep();
  }

  // 5. Generic countdowns (lookT: LOOK pause / SEARCH wander / stuck wait).
  c.lookT -= dt;

  // 6. Radio smash: stand still for 1.5s, destroy the radio, -> SEARCH.
  if (c.smashT > 0) {
    c.smashT -= dt;
    if (c.smashT <= 0) {
      if (c.tgt) _removeRadioAt(c.tgt.x, c.tgt.y);
      _toSearch();
    }
    return;
  }

  // 7. State timers.
  if (c.cstate === 'LOOK') {
    if (c.lookT <= 0) _toSearch();
    return; // LOOK stands still
  }
  if (c.cstate === 'SEARCH') {
    c.searchT -= dt;
    if (c.searchT <= 0) {
      c.susp = Math.max(0, c.susp - 30);
      c.cstate = 'ROAM';
      c.tgt = null;
      c.path = [];
      c.tickT = 0;
      c.lookT = 0;
      return;
    }
    if (c.lookT <= 0) _pickWander();
  }

  // 8. Tick accumulator: one tile-step per tick at the state's rate.
  // v3: HUNT interval shortens with per-keycard escalation.
  var interval = c.cstate === 'ROAM' ? C.C_TICK_ROAM :
                 c.cstate === 'INVESTIGATE' ? C.C_TICK_INV :
                 c.cstate === 'HUNT' ? _escHuntTick() :
                 c.cstate === 'SEARCH' ? C.C_TICK_ROAM : 1e9;
  c.tickT += dt;
  if (c.tickT >= interval) {
    c.tickT = 0;
    _tickStep();
  }
}


/* ---------------- 3D form: "the wrong human" (ORIGINAL design) ----------------
 * A ~2.2 m procedurally built humanoid: deep hunch, overlong thin arms
 * (forearms longer than upper arms), reverse-jointed digitigrade legs,
 * featureless ovoid head, left arm hanging lower, resting head tilt.
 * Pure unlit black silhouette (MeshBasicMaterial 0x000000) with a faint
 * dark-red back-side rim shell. Amber eyes (#FF7A1A) are the only face.
 * One amber PointLight + one additive halo sprite = the whole light budget.
 */

// Amber eye palette (NOT red — red is reserved for nothing here; white-hot
// is reserved for the 150 ms lunge flash at capture).
var CR_AMBER = 0xff7a1a;
var CR_HALO = 0xff3d00;

// _cr: all presentation state (timers, ladder, animation phases). Reset per
// run by Creature.resetRun(); G.time regression also triggers it.
var _cr = {
  prevState: null,      // last FSM state (transition detection)
  // reveal ladder
  autoRung: 0, autoT: 0,        // auto-granted rung + hold timer
  manualRung: 0, manualT: 0,    // setRevealRung rung + hold timer
  effRung: 0,                   // effective rung applied this frame
  r3shown: 0,                   // rung-3 showings this run (cap 3)
  lastT: 0,                     // G.time last frame (run-reset detection)
  // eyes
  blinkT: 5, blinkDur: 0,       // blink countdown / active blink time
  sonarT: 0,                    // sonarFlash full-bright timer
  whiteHot: 0,                  // lunge white-hot timer
  // head-snap listen
  snapT: 0, snapYaw: 0,         // freeze timer / target head yaw
  // twitch
  twitchT: 8, twitch: null,     // countdown / active {obj,axis,base,t,dur}
  // walk cycle
  walkPhase: 0, stepT: 0.5, stepSide: false,
  lastWX: 0, lastWZ: 0,         // group pos last frame (movement detect)
  // dust trace
  dustT: 0, lastTileX: -1, lastTileY: -1,
  // afterimages (hunt)
  afterT: 0,
  // taken sequence
  taken: false, takenT: 0, takenBeats: 0,
  lungeT: -1, lungeArm: 1, lungeAng: 0
};

// _rig: named pivots + key meshes, rebuilt by buildCreatureMesh().
var _rig = null;

// Public API. revealRung is read-only; setRevealRung(n) forces a rung for
// ~2 s (systems worker use); sonarFlash() is the sonar-reveal eye flash;
// beginTaken() runs the TAKEN timeline; takenActive() is the AI freeze flag.
var Creature = {
  get revealRung() { return _cr.effRung; },
  setRevealRung: function (n) {
    n = Math.max(0, Math.min(4, n | 0));
    _cr.manualRung = n;
    _cr.manualT = 2.0;
    _cr.effRung = Math.max(_cr.autoRung, _cr.manualRung);
  },
  sonarFlash: function () {
    _cr.sonarT = 0.5; // amber eyes snap to full bright, then restore
    if (_cr.manualRung < 2) { _cr.manualRung = 2; _cr.manualT = 0.6; }
    _cr.effRung = Math.max(_cr.autoRung, _cr.manualRung);
  },
  beginTaken: function () {
    if (_cr.taken) return;
    _cr.effRung = 4;
    _cr.taken = true;
    _cr.takenT = 0;
    _cr.takenBeats = 0;
    _cr.lungeT = -1;
    _cr.shakeBase = null; // v3: FOV/shake state, set at lunge start
    _cr.lungeArm = Math.random() < 0.5 ? -1 : 1; // which arm leads (varies)
    _cr.lungeAng = (Math.random() - 0.5) * 0.6; // approach angle (varies)
  },
  takenActive: function () { return _cr.taken; },
  resetRun: function () {
    _cr.prevState = null;
    _cr.autoRung = 0; _cr.autoT = 0;
    _cr.manualRung = 0; _cr.manualT = 0;
    _cr.effRung = 0; _cr.r3shown = 0;
    _cr.blinkT = 4 + Math.random() * 5; _cr.blinkDur = 0;
    _cr.sonarT = 0; _cr.whiteHot = 0;
    _cr.snapT = 0; _cr.twitchT = 6 + Math.random() * 8; _cr.twitch = null;
    _cr.walkPhase = 0; _cr.stepT = 0.5; _cr.stepSide = false;
    _cr.dustT = 0; _cr.lastTileX = -1; _cr.lastTileY = -1;
    _cr.afterT = 0;
    _cr.taken = false; _cr.takenT = 0; _cr.takenBeats = 0; _cr.lungeT = -1;
    _cr.shakeBase = null; // v3: clear FOV/shake state
    _cr.lastT = 0;
    _takenVeil(null); // remove any leftover vignette overlay
    _cr_resetMesh(); // restore pose/visibility (retry after a TAKEN, or fresh build)
  }
};

// Restore the mesh to its neutral rung-0 state. Guarded: _rig is null when
// resetRun runs at the top of buildCreatureMesh (before the rebuild).
function _cr_resetMesh() {
  if (!_rig) return;
  var g = _rig.group;
  g.visible = true;
  g.scale.set(1, 1, 1);
  _rig.rig.position.set(0, 0, 0);
  _rig.rig.scale.set(1, 1, 1);
  _rig.torsoG.rotation.set(0.22, 0, 0);
  _rig.neckG.rotation.set(0, 0, 0.19);
  _rig.shoulderL.rotation.set(0, 0, 0.06);
  _rig.shoulderR.rotation.set(0, 0, -0.06);
  _rig.elbowL.rotation.set(0, 0, 0);
  _rig.elbowR.rotation.set(0, 0, 0);
  _rig.hipL.rotation.set(0, 0, 0);
  _rig.hipR.rotation.set(0, 0, 0);
  _rig.kneeL.rotation.set(0, 0, 0);
  _rig.kneeR.rotation.set(0, 0, 0);
  // Rung 0: absence — nothing visible, light off.
  for (var i = 0; i < _rig.flesh.length; i++) _rig.flesh[i].visible = false;
  _rig.rim.visible = false;
  _rig.eyeL.visible = false; _rig.eyeR.visible = false;
  _rig.eyeLight.visible = false;
  _rig.eyeLight.color.setHex(CR_AMBER);
  _rig.eyeLight.intensity = 0;
  _rig.eyeMatL.color.setRGB(0.22, 0.105, 0.022);
  _rig.eyeMatR.color.setRGB(0.22, 0.105, 0.022);
  _rig.halo.visible = false;
  for (var ai = 0; ai < _rig.afters.length; ai++) {
    _rig.afters[ai].t = 0;
    _rig.afters[ai].sp.visible = false;
  }
}

// Radial-gradient canvas texture for the amber eye halo (additive sprite).
function _cr_haloTexture() {
  var cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  var ctx = cv.getContext('2d');
  var gr = ctx.createRadialGradient(64, 64, 2, 64, 64, 64);
  gr.addColorStop(0.0, 'rgba(255,180,90,0.85)');
  gr.addColorStop(0.25, 'rgba(255,122,26,0.45)');
  gr.addColorStop(0.55, 'rgba(255,61,0,0.16)');
  gr.addColorStop(1.0, 'rgba(255,61,0,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(cv);
}

// Soft vertical dark streak for hunt afterimages.
function _cr_streakTexture() {
  var cv = document.createElement('canvas');
  cv.width = 64; cv.height = 128;
  var ctx = cv.getContext('2d');
  var gr = ctx.createLinearGradient(0, 0, 64, 0);
  gr.addColorStop(0.0, 'rgba(0,0,0,0)');
  gr.addColorStop(0.5, 'rgba(0,0,0,0.9)');
  gr.addColorStop(1.0, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 64, 128);
  var gv = ctx.createLinearGradient(0, 0, 0, 128);
  gv.addColorStop(0.0, 'rgba(0,0,0,1)');
  gv.addColorStop(0.35, 'rgba(0,0,0,0)');
  gv.addColorStop(0.7, 'rgba(0,0,0,0)');
  gv.addColorStop(1.0, 'rgba(0,0,0,1)');
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = gv;
  ctx.fillRect(0, 0, 64, 128);
  return new THREE.CanvasTexture(cv);
}

// Fullscreen vignette / hard-cut veil for the TAKEN beats. mode null =
// remove; 'edge' = 20% edge darken; 'black' = hard cut to black.
var _cr_veilEl = null;
function _takenVeil(mode) {
  if (mode === null) {
    if (_cr_veilEl && _cr_veilEl.parentNode) _cr_veilEl.parentNode.removeChild(_cr_veilEl);
    _cr_veilEl = null;
    return;
  }
  if (!_cr_veilEl) {
    _cr_veilEl = document.createElement('div');
    _cr_veilEl.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:4000;';
    document.body.appendChild(_cr_veilEl);
  }
  if (mode === 'edge') {
    _cr_veilEl.style.background =
      'radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%)';
  } else if (mode === 'black') {
    _cr_veilEl.style.background = '#000';
  }
}

/* Build the creature mesh: ~13 primitives, pure black unlit silhouette.
 * Named pivots: neckG, shoulderL/R, elbowL/R, hipL/R, kneeL/R.
 * Hierarchy: group -> rig (weave/lunge offsets) -> pelvis/torsoG/hips,
 * torsoG -> torso, rim shell, shoulderL/R -> elbowL/R, neckG -> neck, head,
 * eyes, eye light, halo. Legs: hipL/R -> kneeL/R (digitigrade).
 */
function buildCreatureMesh() {
  if (W3.creatureGroup) {
    W3.scene.remove(W3.creatureGroup);
    W3.creatureGroup = null;
  }
  // Afterimage sprites live directly on the scene (not the group): remove
  // the old pool so rebuilds don't leak them (§3.5 dispose rule).
  if (_rig) {
    for (var di = 0; di < _rig.afters.length; di++) {
      var dsp = _rig.afters[di].sp;
      if (dsp.parent) dsp.parent.remove(dsp);
      dsp.material.map.dispose();
      dsp.material.dispose();
    }
    _rig = null;
  }
  Creature.resetRun();

  var g = new THREE.Group();
  var rig = new THREE.Group(); // lateral weave / lunge / breathing offsets
  g.add(rig);

  var flesh = new THREE.MeshBasicMaterial({ color: 0x000000 });
  var rimMat = new THREE.MeshBasicMaterial({ color: 0x140303, side: THREE.BackSide });
  var fleshMeshes = [];

  function part(geo, mat, x, y, z) {
    var m = new THREE.Mesh(geo, mat || flesh);
    m.position.set(x, y, z);
    if (!mat || mat === flesh) fleshMeshes.push(m);
    return m;
  }

  // Pelvis block.
  rig.add(part(new THREE.BoxGeometry(0.30, 0.22, 0.20), null, 0, 1.02, 0));

  // Torso group (pivot at hips, y=1.05): pitch = hunch + idle sway.
  var torsoG = new THREE.Group();
  torsoG.position.set(0, 1.05, 0);
  rig.add(torsoG);
  var torso = part(new THREE.CylinderGeometry(0.17, 0.12, 0.72, 8), null, 0, 0.36, 0.02);
  torsoG.add(torso);
  // Faint dark-red rim: slightly larger back-side shell of the torso.
  var rim = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.132, 0.74, 8), rimMat);
  rim.position.copy(torso.position);
  torsoG.add(rim);
  // Shoulder bar (gaunt clavicle ridge).
  torsoG.add(part(new THREE.BoxGeometry(0.56, 0.12, 0.16), null, 0, 0.66, 0.05));

  // Arms: ~1.3x human length, thin; forearm slightly longer than upper arm.
  // shoulderL hangs ~10% lower (asymmetry).
  function buildArm(side) { // side: -1 left, +1 right
    var sh = new THREE.Group();
    var drop = (side < 0) ? 0.06 : 0; // left arm hangs lower
    sh.position.set(0.30 * side, 0.64 - drop, 0.07);
    var upper = part(new THREE.CylinderGeometry(0.038, 0.030, 0.62, 6), null, 0, -0.31, 0);
    sh.add(upper);
    var el = new THREE.Group();
    el.position.set(0, -0.62, 0);
    var fore = part(new THREE.CylinderGeometry(0.030, 0.022, 0.72, 6), null, 0, -0.36, 0);
    el.add(fore);
    sh.add(el);
    torsoG.add(sh);
    return { sh: sh, el: el };
  }
  var armL = buildArm(-1), armR = buildArm(1);

  // Neck group (pivot y=1.83 world): head yaw/pitch/tilt all live here.
  var neckG = new THREE.Group();
  neckG.position.set(0, 0.78, 0.14); // forward of shoulders (deep hunch)
  torsoG.add(neckG);
  neckG.add(part(new THREE.CylinderGeometry(0.07, 0.09, 0.22, 6), null, 0, 0.08, 0.01));

  // Head: smooth featureless ovoid — no mouth, no nose. Only the eyes exist.
  var head = part(new THREE.SphereGeometry(0.20, 14, 12), null, 0, 0.30, 0.05);
  head.scale.set(0.85, 1.15, 0.95);
  neckG.add(head);

  // Eyes: two amber spheres r=0.035 on the head front. The only face it has.
  var eyeGeo = new THREE.SphereGeometry(0.035, 10, 8);
  var eyeMatL = new THREE.MeshBasicMaterial({ color: CR_AMBER });
  var eyeMatR = new THREE.MeshBasicMaterial({ color: CR_AMBER });
  var eyeL = new THREE.Mesh(eyeGeo, eyeMatL);
  eyeL.position.set(-0.075, 0.32, 0.225);
  var eyeR = new THREE.Mesh(eyeGeo, eyeMatR);
  eyeR.position.set(0.075, 0.32, 0.225);
  neckG.add(eyeL); neckG.add(eyeR);

  // ONE amber point light (the entire creature light budget), distance ~6.
  var eyeLight = new THREE.PointLight(CR_AMBER, 1.0, 6);
  eyeLight.position.set(0, 0.32, 0.34);
  neckG.add(eyeLight);

  // ONE additive halo sprite for the eye pair, scale pulsing 0.25–0.4.
  var halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: _cr_haloTexture(), blending: THREE.AdditiveBlending,
    transparent: true, depthWrite: false, opacity: 0.6
  }));
  halo.position.set(0, 0.32, 0.26);
  halo.scale.set(0.3, 0.3, 1);
  neckG.add(halo);

  // Legs: reverse-jointed (digitigrade). Hip pivots at y=1.05.
  function buildLeg(side) {
    var hip = new THREE.Group();
    hip.position.set(0.11 * side, 1.05, 0);
    var thigh = part(new THREE.CylinderGeometry(0.055, 0.042, 0.55, 6), null, 0, -0.27, -0.02);
    thigh.rotation.x = -0.12;
    hip.add(thigh);
    var knee = new THREE.Group();
    knee.position.set(0, -0.55, -0.06);
    var shin = part(new THREE.CylinderGeometry(0.040, 0.028, 0.52, 6), null, 0, -0.24, 0.10);
    shin.rotation.x = 0.42; // reverse joint: shin angles forward-down
    knee.add(shin);
    var foot = part(new THREE.BoxGeometry(0.09, 0.06, 0.22), null, 0, -0.47, 0.20);
    knee.add(foot);
    hip.add(knee);
    rig.add(hip);
    return { hip: hip, knee: knee };
  }
  var legL = buildLeg(-1), legR = buildLeg(1);

  // Afterimage pool (hunt motion-smear): 3 fading sprites.
  var streakTex = _cr_streakTexture();
  var afters = [];
  for (var ai = 0; ai < 3; ai++) {
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: streakTex, transparent: true, opacity: 0, depthWrite: false
    }));
    sp.scale.set(0.7, 2.3, 1);
    sp.visible = false;
    W3.scene.add(sp);
    afters.push({ sp: sp, t: 0 });
  }

  // Spawn at the creature's current tile center (no first-frame pop).
  var w0 = worldFromTile(Math.floor(G.creature.x), Math.floor(G.creature.y));
  g.position.set(w0.x, 0, w0.z);

  _rig = {
    group: g, rig: rig, torsoG: torsoG, neckG: neckG, head: head,
    shoulderL: armL.sh, elbowL: armL.el, shoulderR: armR.sh, elbowR: armR.el,
    hipL: legL.hip, kneeL: legL.knee, hipR: legR.hip, kneeR: legR.knee,
    eyeMatL: eyeMatL, eyeMatR: eyeMatR, eyeL: eyeL, eyeR: eyeR,
    eyeLight: eyeLight, halo: halo, flesh: fleshMeshes, rim: rim, afters: afters,
    yaw: 0, lastWX: w0.x, lastWZ: w0.z
  };
  _cr.lastWX = w0.x; _cr.lastWZ = w0.z;

  W3.scene.add(g);
  W3.creatureGroup = g;
  _cr_resetMesh(); // start at rung 0 (absence) even before the first sync
  return g;
}

/* Per-frame presentation: position lerp, facing, reveal ladder, eyes,
 * the 6 procedural animations, and all creature audio hooks.
 * Called from main.js _playStep3D AFTER updateCreature (so the grab check in
 * checkCapture3D re-measures distance after the entity moved — §3.5).
 */
function syncCreatureMesh(dt) {
  var g = W3.creatureGroup;
  if (!g || !_rig) return;

  // Retry detection: G.time regressed -> fresh run, reset presentation.
  if (G.time < _cr.lastT - 0.001) Creature.resetRun();
  _cr.lastT = G.time;

  // The TAKEN timeline owns the mesh once the grab lands.
  if (_cr.taken) { _updateTaken(dt); return; }

  var c = G.creature, p = G.player;
  var t = G.time;
  var w = worldFromTile(Math.floor(c.x), Math.floor(c.y));

  // 1. Smooth position lerp toward the tile center (sim moves discretely).
  var px0 = g.position.x, pz0 = g.position.z;
  var k = Math.min(1, dt * 9);
  g.position.x += (w.x - g.position.x) * k;
  g.position.z += (w.z - g.position.z) * k;

  // Movement detection from actual group travel this frame.
  var vx = g.position.x - px0, vz = g.position.z - pz0;
  var moved = Math.hypot(vx, vz);
  var moving = moved > 0.0008;
  _rig.lastWX = g.position.x; _rig.lastWZ = g.position.z;

  // 2. Face the movement direction (shortest-arc yaw lerp, +z convention).
  if (vx * vx + vz * vz > 1e-10) {
    var targetYaw = Math.atan2(vx, vz);
    var d = targetYaw - _rig.yaw;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    _rig.yaw += d * Math.min(1, dt * 8);
    g.rotation.y = _rig.yaw;
  }

  // Floor-plane distance, tiles (tile coords carry no Y: this IS hypot(dx,dz)).
  var dTiles = Math.hypot(p.x - c.x, p.y - c.y);
  var st = c.cstate;
  var hunt = st === 'HUNT';

  // 3. FSM transition: audio state hook, hunt-mode flag, head-snap trigger.
  if (_cr.prevState !== st) {
    if (Sfx.onCreatureState) {
      try { Sfx.onCreatureState(String(st).toLowerCase()); } catch (e) {}
    }
    if (typeof Lab !== 'undefined' && Lab.setHuntMode) {
      try { Lab.setHuntMode(st === 'HUNT'); } catch (e) {}
    }
    if (st === 'INVESTIGATE') {
      // (2) head-snap listen: 120 ms HARD snap toward the heard tile, then
      // 0.8 s freeze. A step, not a lerp — this is the "it heard that" beat.
      _cr.snapT = 0.92;
      if (c.tgt) {
        var tw = worldFromTile(c.tgt.x, c.tgt.y);
        var yawTo = Math.atan2(tw.x - g.position.x, tw.z - g.position.z);
        var rel = yawTo - _rig.yaw;
        while (rel > Math.PI) rel -= Math.PI * 2;
        while (rel < -Math.PI) rel += Math.PI * 2;
        _cr.snapYaw = rel;
        _rig.neckG.rotation.y = rel;
      }
    }
    _cr.prevState = st;
  }
  var frozen = _cr.snapT > 0; // head-snap freeze window
  if (frozen) _cr.snapT -= dt;

  // 4. Reveal ladder: never show more than the current rung allows.
  _cr.autoT -= dt; if (_cr.autoT <= 0) _cr.autoRung = 0;
  _cr.manualT -= dt; if (_cr.manualT <= 0) _cr.manualRung = 0;
  if (_cr.autoT <= 0 && _cr.manualT <= 0) {
    if (st === 'LOOK' && dTiles < 4 && _cr.r3shown < 3) {
      _cr.autoRung = 3; _cr.autoT = 1.5; _cr.r3shown++; // ≤1.5 s, ≤3/run
    } else if (st === 'INVESTIGATE' && dTiles >= 2 && dTiles <= 7) {
      _cr.autoRung = 2; _cr.autoT = 0.8; // eyes only, <1 s
    } else if (hunt) {
      _cr.autoRung = 2; _cr.autoT = 0.6; // unblinking burn, eyes only
    }
  }
  _cr.effRung = Math.max(_cr.autoRung, _cr.manualRung);
  var rung = _cr.effRung;
  var bodyVis = rung >= 3, eyeVis = rung >= 2;
  for (var fi = 0; fi < _rig.flesh.length; fi++) _rig.flesh[fi].visible = bodyVis;
  _rig.rim.visible = bodyVis;
  _rig.eyeL.visible = eyeVis; _rig.eyeR.visible = eyeVis;
  _rig.eyeLight.visible = eyeVis;
  _rig.halo.visible = eyeVis;

  // Rung 1 trace: dust where it passed unseen (cheap: guarded + cooldown +
  // only when the player is far enough that it truly passed unseen).
  var ctx = Math.floor(c.x), cty = Math.floor(c.y);
  _cr.dustT -= dt;
  if (ctx !== _cr.lastTileX || cty !== _cr.lastTileY) {
    _cr.lastTileX = ctx; _cr.lastTileY = cty;
    if (rung <= 1 && dTiles > 4 && _cr.dustT <= 0 &&
        typeof Lab !== 'undefined' && Lab.dustBurst) {
      try { Lab.dustBurst(g.position.x, g.position.z); } catch (e) {}
      _cr.dustT = 0.4;
    }
  }

  // 5. Eyes: brightness ← suspicion 0–100 (dim flicker → steady burn).
  _cr.blinkT -= dt;
  if (_cr.blinkT <= 0 && !hunt) { // blink: 80–120 ms, every 4–9 s; never in HUNT
    _cr.blinkDur = 0.08 + Math.random() * 0.04;
    _cr.blinkT = 4 + Math.random() * 5;
  }
  var blinking = false;
  if (_cr.blinkDur > 0) { _cr.blinkDur -= dt; blinking = _cr.blinkDur > 0; }
  _cr.sonarT = Math.max(0, _cr.sonarT - dt);

  var s01 = Math.max(0, Math.min(1, c.susp / C.SUSP_MAX));
  var bright = 0.22 + 0.78 * s01;
  if (s01 < 0.4) bright *= 0.72 + 0.28 * Math.sin(t * 13.0) * Math.sin(t * 7.3);
  if (blinking) bright = 0;          // extinguish
  if (_cr.sonarT > 0) bright = 1.15; // sonarFlash: full amber
  if (bright > 1.15) bright = 1.15;
  var bc = Math.max(0, Math.min(1, bright));
  // Amber core #FF7A1A = (1.0, 0.478, 0.102); brightness scales the hue.
  _rig.eyeMatL.color.setRGB(bc, 0.478 * bc, 0.102 * bc);
  _rig.eyeMatR.color.setRGB(bc, 0.478 * bc, 0.102 * bc);
  _rig.eyeLight.intensity = eyeVis ?
    (0.45 + 2.1 * s01 + (_cr.sonarT > 0 ? 1.2 : 0)) * (0.9 + 0.1 * Math.sin(t * 9)) : 0;
  var hs = 0.25 + 0.15 * (0.5 + 0.5 * Math.sin(t * 5.2)) * (0.4 + 0.6 * s01);
  _rig.halo.scale.set(hs, hs, 1);
  _rig.halo.material.opacity = eyeVis ?
    Math.min(1, 0.30 + 0.55 * s01 + (_cr.sonarT > 0 ? 0.25 : 0)) : 0;

  // 6. Animations on the named pivots.
  var swayAmt = hunt ? 0 : 1; // HUNT: all noise removed
  var stepDur = hunt ? 0.32 : (st === 'INVESTIGATE' ? 0.45 : 0.62);
  if (moving) _cr.walkPhase += dt * 2 * Math.PI / stepDur;
  var ph = _cr.walkPhase;
  var swing = moving ? 1 : 0;

  // (1) idle sway: torso pitch ±3° @0.5 Hz; head tilt 8°→14° @0.23 Hz with a
  // detuned second sine so it never loops cleanly; arms counter-phase ±4°.
  _rig.torsoG.rotation.x = (hunt ? 0.34 : 0.22) + swayAmt * Math.sin(t * Math.PI) * 0.052;
  if (!frozen) {
    _rig.neckG.rotation.z = (hunt ? 0.07 : 0.19) + swayAmt *
      (Math.sin(t * 2 * Math.PI * 0.23 + 1.7) * 0.052 + Math.sin(t * 0.61) * 0.012);
    if (hunt) _rig.neckG.rotation.y += (0 - _rig.neckG.rotation.y) * Math.min(1, dt * 6);
    else if (st === 'INVESTIGATE') _rig.neckG.rotation.y += (0 - _rig.neckG.rotation.y) * Math.min(1, dt * 1.5);
  }

  if (hunt) {
    // (5) hunt run: torso drops (above), arms pump, head locked forward.
    _rig.shoulderL.rotation.x = Math.sin(ph) * 0.7;
    _rig.shoulderR.rotation.x = Math.sin(ph + Math.PI) * 0.7;
    _rig.elbowL.rotation.x = -0.9; _rig.elbowR.rotation.x = -0.9;
    _rig.shoulderL.rotation.z = 0.15; _rig.shoulderR.rotation.z = -0.15;
    _rig.rig.position.x = 0;
  } else {
    // (4) knuckle-drag walk: long arm swing, torso bob 0.06 m at step
    // frequency, ±0.15 m lateral weave, feet skim (no IK grounding).
    _rig.shoulderL.rotation.x = swing * Math.sin(ph) * 0.55;
    _rig.shoulderR.rotation.x = swing * Math.sin(ph + Math.PI) * 0.55;
    _rig.elbowL.rotation.x = -0.22 - swing * Math.max(0, Math.sin(ph)) * 0.25;
    _rig.elbowR.rotation.x = -0.22 - swing * Math.max(0, Math.sin(ph + Math.PI)) * 0.25;
    _rig.shoulderL.rotation.z = 0.06 + swayAmt * Math.sin(t * Math.PI + Math.PI) * 0.07;
    _rig.shoulderR.rotation.z = -0.06 + swayAmt * Math.sin(t * Math.PI) * 0.07;
    _rig.rig.position.x = swing * Math.sin(ph * 0.5) * 0.15;
  }
  _rig.rig.position.y = swing * Math.abs(Math.sin(ph)) * 0.06;
  _rig.hipL.rotation.x = swing * Math.sin(ph) * 0.45;
  _rig.hipR.rotation.x = swing * Math.sin(ph + Math.PI) * 0.45;
  _rig.kneeL.rotation.x = swing * Math.max(0, -Math.sin(ph)) * 0.55;
  _rig.kneeR.rotation.x = swing * Math.max(0, -Math.sin(ph + Math.PI)) * 0.55;

  // (3) twitch: every 6–14 s one random limb does a 90 ms double-jerk ±15°.
  // Never during HUNT (hunt reads as purposeful).
  _cr.twitchT -= dt;
  if (_cr.twitchT <= 0 && !hunt) {
    var limbs = [_rig.shoulderL, _rig.shoulderR, _rig.elbowL,
                 _rig.elbowR, _rig.hipL, _rig.kneeL];
    _cr.twitch = { obj: limbs[(Math.random() * limbs.length) | 0], t: 0, dur: 0.09 };
    _cr.twitchT = 6 + Math.random() * 8;
  }
  if (_cr.twitch) {
    var tw2 = _cr.twitch;
    tw2.t += dt;
    var pr = tw2.t / tw2.dur;
    if (pr >= 1) { _cr.twitch = null; }
    else {
      // Double-jerk: two ±15° (0.26 rad) jerks inside 90 ms, decaying.
      var jerk = Math.sin(pr * Math.PI * 4) * 0.26 * (1 - pr);
      tw2.obj.rotation.x += jerk;
    }
  }

  // (5b) hunt afterimages: 2–3 fading sprites, opacity 0.25→0 over 0.3 s.
  if (hunt && moving) {
    _cr.afterT -= dt;
    if (_cr.afterT <= 0) {
      _cr.afterT = 0.12;
      for (var ai2 = 0; ai2 < _rig.afters.length; ai2++) {
        if (_rig.afters[ai2].t <= 0) {
          _rig.afters[ai2].t = 0.3;
          _rig.afters[ai2].sp.position.set(g.position.x, 1.15, g.position.z);
          _rig.afters[ai2].sp.visible = true;
          break;
        }
      }
    }
  }
  for (var ai3 = 0; ai3 < _rig.afters.length; ai3++) {
    var a = _rig.afters[ai3];
    if (a.t > 0) {
      a.t -= dt;
      a.sp.material.opacity = Math.max(0, a.t / 0.3) * 0.25;
      if (a.t <= 0) a.sp.visible = false;
    }
  }

  // Slight breathing scale pulse.
  var br = 1 + 0.012 * Math.sin(t * 2 * Math.PI * 0.28);
  _rig.rig.scale.set(1, br, 1);

  // 7. Audio hooks (all guarded: the audio worker owns these names).
  _creatureAudio(dt, dTiles, g.position.x, g.position.z, stepDur, moving, hunt, p, g);
}

// Per-frame creature audio hooks. Floor-plane coords feed the panner;
// breath follows proximity < 6 m; suspicion streams 0–1 every frame.
function _creatureAudio(dt, dTiles, wx, wz, stepDur, moving, hunt, p, g) {
  var pn = Sfx.creaturePanner;
  if (pn) {
    try {
      if (pn.positionX) {
        pn.positionX.value = wx; pn.positionY.value = 1.2; pn.positionZ.value = wz;
      } else if (pn.setPosition) { pn.setPosition(wx, 1.2, wz); }
    } catch (e) {}
  }
  if (Sfx.setBreathLevel01) {
    try { Sfx.setBreathLevel01(dTiles < 6 ? Math.max(0, 1 - dTiles / 6) : 0); } catch (e) {}
  }
  if (Sfx.setSuspicion01) {
    try { Sfx.setSuspicion01(Math.max(0, Math.min(1, G.creature.susp / C.SUSP_MAX))); } catch (e) {}
  }
  // Footsteps on walk-cycle contact moments; arrhythmic limp: the left
  // step lands ~15% late.
  _cr.stepT -= dt;
  if (moving && _cr.stepT <= 0) {
    _cr.stepSide = !_cr.stepSide;
    _cr.stepT = stepDur * (_cr.stepSide ? 1.15 : 1.0);
    if (Sfx.creatureStep) {
      try { Sfx.creatureStep(hunt || dTiles < 3); } catch (e) {}
    }
    // Behind-the-player pulse: dot < -0.3 within 8 m, on the footstep.
    if (dTiles < 8) {
      var pwx = (p.x + 0.5) * C.TILE3D, pwz = (p.y + 0.5) * C.TILE3D;
      var dxw = wx - pwx, dzw = wz - pwz;
      var dl = Math.hypot(dxw, dzw);
      if (dl > 0.001) {
        var dot = (dxw / dl) * (-Math.sin(p.yaw)) + (dzw / dl) * (-Math.cos(p.yaw));
        if (dot < -0.3 && Sfx.behindPulse) {
          try { Sfx.behindPulse(); } catch (e) {}
        }
      }
    }
  } else if (!moving) {
    _cr.stepT = Math.min(_cr.stepT, 0.05); // step promptly when motion resumes
  }
}

/* TAKEN 1.2 s timeline (rung 4 — the ONLY full close look, and it kills).
 * Runs ONLY through the legitimate floor-plane grab path in checkCapture3D.
 * Beats: t-0.5 silence (all creature audio cuts) -> t-0.3 eyes out + vignette
 * -> t=0 lunge 0.45 s + caught sting -> t=0.45 hard cut to black -> the
 * existing capture->lose wiring. Lunge varies per capture (approach angle,
 * which arm leads) so repeat deaths don't turn slapstick.
 */
function _updateTaken(dt) {
  var g = W3.creatureGroup;
  if (!g || !_rig) return;
  var p = G.player;
  _cr.takenT += dt;
  var T = _cr.takenT;

  // t-0.5 s (T=0): the silence beat. All creature audio cuts; eyes out.
  // v3: TOTAL silence — the master bus goes black too. Absence is scary.
  if (T >= 0 && !(_cr.takenBeats & 1)) {
    _cr.takenBeats |= 1;
    if (Sfx.takenSilence) { try { Sfx.takenSilence(); } catch (e) {} }
    if (Sfx.takenBlackout) { try { Sfx.takenBlackout(); } catch (e) {} }
    _cr.effRung = 4;
    _rig.eyeMatL.color.setRGB(0, 0, 0);
    _rig.eyeMatR.color.setRGB(0, 0, 0);
    _rig.eyeLight.intensity = 0;
    _rig.halo.material.opacity = 0;
    _rig.eyeL.visible = true; _rig.eyeR.visible = true;
    for (var fi = 0; fi < _rig.flesh.length; fi++) _rig.flesh[fi].visible = true;
    _rig.rim.visible = true;
    _rig.eyeLight.visible = false;
    _rig.halo.visible = false;
  }
  // t-0.3 s (T=0.2): screen edges darken 20% (vignette close-in).
  if (T >= 0.2 && !(_cr.takenBeats & 2)) {
    _cr.takenBeats |= 2;
    _takenVeil('edge');
  }
  // t=0 (T=0.5): lunge (rung 4) + MASSIVE impact (v3: sub-bass + dry crack).
  if (T >= 0.5 && !(_cr.takenBeats & 4)) {
    _cr.takenBeats |= 4;
    _cr.lungeT = 0;
    _cr.whiteHot = 0.15; // eyes white-hot for 150 ms
    _cr.lungeFromX = g.position.x; _cr.lungeFromZ = g.position.z;
    var pwx = (p.x + 0.5) * C.TILE3D, pwz = (p.y + 0.5) * C.TILE3D;
    var dx = pwx - g.position.x, dz = pwz - g.position.z;
    var dl = Math.hypot(dx, dz) || 1;
    var ca = Math.cos(_cr.lungeAng), sa = Math.sin(_cr.lungeAng);
    var rx = (dx / dl) * ca - (dz / dl) * sa;
    var rz = (dx / dl) * sa + (dz / dl) * ca;
    _cr.lungeToX = pwx + rx * 2.0;
    _cr.lungeToZ = pwz + rz * 2.0;
    // v3: store the camera base for the shake (player input is frozen,
    // so nothing else moves the camera during the timeline).
    if (W3.camera) {
      _cr.shakeBase = { x: W3.camera.position.x, y: W3.camera.position.y,
                        z: W3.camera.position.z };
    }
    if (Sfx.takenImpact) { try { Sfx.takenImpact(); } catch (e) {} }
  }
  // t=0.45 s (T=0.95): hard cut to black + 0.4 s of true silence (v3).
  if (T >= 0.95 && !(_cr.takenBeats & 8)) {
    _cr.takenBeats |= 8;
    _takenVeil('black');
    g.visible = false;
    // Restore the camera the shake borrowed.
    if (W3.camera) {
      W3.camera.fov = 70;
      W3.camera.updateProjectionMatrix();
      if (_cr.shakeBase) {
        W3.camera.position.set(_cr.shakeBase.x, _cr.shakeBase.y, _cr.shakeBase.z);
      }
      W3.camera.rotation.z = 0;
    }
    _cr.shakeBase = null;
    if (Sfx.takenBlackout) { try { Sfx.takenBlackout(); } catch (e) {} }
  }
  // T=1.35: hand off to the EXISTING capture->lose wiring.
  if (T >= 1.35) {
    _takenVeil(null);
    G.state = 'LOSE';
    G.loseReason = 'caught';
    return;
  }

  // (6) lunge: 0.45 s — scale 1->1.6 toward the camera, arms spread wide,
  // head tilts back (jawless face opening = pure wrongness), eyes white-hot.
  if (_cr.lungeT >= 0 && _cr.lungeT < 0.45) {
    _cr.lungeT += dt;
    var lp = Math.min(1, _cr.lungeT / 0.45);
    var e = 1 - Math.pow(1 - lp, 3); // ease-out: violent arrival
    var s = 1 + 0.6 * e;
    g.scale.set(s, s, s);
    g.position.x = _cr.lungeFromX + (_cr.lungeToX - _cr.lungeFromX) * e;
    g.position.z = _cr.lungeFromZ + (_cr.lungeToZ - _cr.lungeFromZ) * e;
    var lead = _cr.lungeArm; // which arm leads this capture
    _rig.shoulderL.rotation.z = 0.06 + e * 1.25 * (lead < 0 ? 1.15 : 1.0);
    _rig.shoulderR.rotation.z = -0.06 - e * 1.25 * (lead > 0 ? 1.15 : 1.0);
    _rig.shoulderL.rotation.x = e * 0.4;
    _rig.shoulderR.rotation.x = e * 0.4;
    _rig.elbowL.rotation.x = -e * 0.3;
    _rig.elbowR.rotation.x = -e * 0.3;
    _rig.neckG.rotation.x = -0.55 * e; // head tilts back
    _rig.torsoG.rotation.x = 0.34 - 0.15 * e;
    // v3: FOV PUNCH + violent screen shake. FOV kicks 70 -> 94 at peak
    // violence and snaps back as the hard cut lands; the camera shakes
    // hardest at lunge start and settles into the black.
    var cam = W3.camera;
    if (cam && _cr.shakeBase) {
      cam.fov = 70 + 24 * Math.sin(lp * Math.PI);
      cam.updateProjectionMatrix();
      var shAmp = 0.34 * (1 - e) + 0.04;
      cam.position.x = _cr.shakeBase.x + (Math.random() * 2 - 1) * shAmp;
      cam.position.y = _cr.shakeBase.y + (Math.random() * 2 - 1) * shAmp * 0.6;
      cam.position.z = _cr.shakeBase.z + (Math.random() * 2 - 1) * shAmp;
      cam.rotation.z = (Math.random() * 2 - 1) * 0.07 * (1 - e);
    }
    // Eyes white-hot for the first 150 ms, then back to extinguished.
    if (_cr.whiteHot > 0) {
      _cr.whiteHot -= dt;
      _rig.eyeMatL.color.setRGB(1, 1, 1);
      _rig.eyeMatR.color.setRGB(1, 1, 1);
      _rig.eyeLight.visible = true;
      _rig.eyeLight.color.setHex(0xffffff);
      _rig.eyeLight.intensity = 4;
      _rig.halo.visible = true;
      _rig.halo.material.opacity = 0.9;
      if (_cr.whiteHot <= 0) {
        _rig.eyeMatL.color.setRGB(0, 0, 0);
        _rig.eyeMatR.color.setRGB(0, 0, 0);
        _rig.eyeLight.visible = false;
        _rig.halo.visible = false;
      }
    }
  }
}

// Grab test. Floor-plane distance in tile space (tile coords carry no Y, so
// this IS Math.hypot(dx, dz) on the floor plane — never 3D camera distance).
// Re-measured AFTER updateCreature moved the entity this frame (main.js
// _playStep3D calls updateCreature -> syncCreatureMesh -> checkCapture3D).
// A grab starts the TAKEN timeline; the lose wiring fires at its end.
function checkCapture3D() {
  if (G.state !== 'PLAY' || Creature.takenActive()) return;
  var c = G.creature, p = G.player;
  var d = Math.hypot(p.x - c.x, p.y - c.y);
  if (d < C.CAPTURE_D) Creature.beginTaken();
}

/* Echo Chamber 3D — systems.js
 * Sonar, keycards, keycard readers, exit, distractions (throws/radios),
 * expanding 3D rings, and the one-time start map reveal — lab-ified per the
 * 3D visual brief: keycard readers are the #1 prop (red->green with the
 * unlock), the EXIT sign stays DARK until 3/3, the sonar ring melts into the
 * fog, and the pulse's traveling light is what "reveals" geometry.
 *
 * Plain script (no modules). Loaded AFTER world.js and creature.js.
 * References (never redeclares): C, G, W3, LEVEL, Sfx, Tut, Lab, Creature,
 * worldFromTile, hasLOS, emitNoise. All geometry and logic below is original work.
 */

'use strict';

/* ------------------------------------------------ private scratch ---- */
var _s_rings3d = [];    // animated 3D ring meshes {mesh, t, dur, maxR}
var _s_pulses = [];     // sonar pulses {grp, ring, mat, light, t, ringDur, dur, maxR}
var _s_tracers = [];    // thrown-object flash meshes {mesh, t, dur}
var _s_readerDots = []; // keycard-reader dot materials (flipped red<->green on unlock)
var _s_radioFx = [];    // radio audio tracking [{r: radioRef, idx: lastKnownIndex}]

var _s_ICE = 0xBFEFFF;  // sonar ice-blue
var _s_AMBER = 0xF5A524; // distraction amber
var _s_GREEN = 0x2ECC71; // unlocked green
var _s_RED = 0xC0392B;  // locked blood red

// Floor tiles near prominent doorways/junctions that get a wall-mounted
// keycard reader prop. (Verified floor against LEVEL; each has a wall neighbor.)
var _s_READER_SPOTS = [
  [3, 1], [9, 2], [10, 4], [6, 8], [10, 6], [2, 6]
];

function _s_inBounds(tx, ty) {
  return tx >= 0 && ty >= 0 && tx < C.W && ty < C.H;
}

function _s_isFloor(tx, ty) {
  return _s_inBounds(tx, ty) && G.grid[ty][tx] === 0;
}

// Tile center -> world {x, z} (worldFromTile is defined by world.js).
function _s_tileCenter(tx, ty) {
  var w = worldFromTile(tx, ty);
  return { x: w.x, z: w.z };
}

// Player tile, rounded (FPS controller may hold fractional values mid-step).
function _s_playerTile() {
  return { x: Math.floor(G.player.x), y: Math.floor(G.player.y) };
}

// Facing direction quantized from G.player.yaw to one of 4 tile dirs.
// yaw 0 = facing -z (north). World dir = (-sin(yaw), -cos(yaw)) mapped to tiles.
function _s_faceDir() {
  var fx = -Math.sin(G.player.yaw);
  var fz = -Math.cos(G.player.yaw);
  if (Math.abs(fx) > Math.abs(fz)) {
    return { dx: fx > 0 ? 1 : -1, dy: 0 };
  }
  return { dx: 0, dy: fz > 0 ? 1 : -1 };
}

// Remove a mesh (or group) from the scene and free its geometry/materials
// (canvas textures included, so rebuilds across retries don't leak GPU memory).
function _s_dispose(obj) {
  obj.traverse(function (o) {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      var mats = Array.isArray(o.material) ? o.material : [o.material];
      for (var i = 0; i < mats.length; i++) {
        if (mats[i].map) mats[i].map.dispose();
        mats[i].dispose();
      }
    }
  });
  if (obj.parent) obj.parent.remove(obj);
}

/* --------------------------------------------------------- doSonar3D -- */
// 3D port of the 2D doSonar rules: cooldown-gated, stamps G.reveal in r=6
// (Euclidean, tile space), emits noise r=8 / +70 suspicion, and spawns both a
// 2D-style ring event (for HUD-side logic) and the 3D sonar pulse: an
// expanding ring that melts into the fog plus a traveling ice-blue
// PointLight parented to the wavefront — the light is what "reveals" the
// geometry. During the reveal the creature's AMBER eyes flare at the ring's
// edge (via the guarded Creature.sonarFlash hook, owned by creature.js).
function doSonar3D() {
  if (G.state !== 'PLAY' || G.pulseCd > 0) { Sfx.bonk(); return; }
  var pt = _s_playerTile();
  G.pulseCd = C.SONAR_CD;
  var R = C.SONAR_REVEAL_R;
  var x0 = Math.max(0, Math.floor(pt.x - R)), x1 = Math.min(C.W - 1, Math.ceil(pt.x + R));
  var y0 = Math.max(0, Math.floor(pt.y - R)), y1 = Math.min(C.H - 1, Math.ceil(pt.y + R));
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var dx = x - pt.x, dy = y - pt.y;
      if (Math.sqrt(dx * dx + dy * dy) <= R) G.reveal[y * C.W + x] = G.time;
    }
  }
  // 2D-style ring event (marked _m3d so updateRings3D won't double-mirror it).
  G.rings.push({ x: pt.x, y: pt.y, r: 0, maxR: R, t: 0, dur: 0.9,
                 kind: 'sonar', color: '#4de8ff', _m3d: true });
  _s_spawnSonarPulse(pt.x, pt.y);
  emitNoise(pt.x, pt.y, C.SONAR_NOISE_R, C.PULSE_SUSP);
  G.pulsesUsed++;
  if (typeof Creature !== 'undefined' && Creature.sonarFlash) Creature.sonarFlash();
  if (typeof Sfx !== 'undefined') {
    if (Sfx.sonarPing3D) Sfx.sonarPing3D(); else Sfx.ping();
  }
}

// The sonar pulse: expanding ice-blue ring + a PointLight (sonar ice,
// intensity 2.5 -> 0 over the 2.5 s reveal, distance 8) parented to the ring
// mesh so it rides the wavefront outward. Transient — it is the one extra
// point light the budget allows, and it dies with the pulse.
function _s_spawnSonarPulse(tx, ty) {
  var c = _s_tileCenter(tx, ty);
  var grp = new THREE.Group();
  var geo = new THREE.RingGeometry(0.9, 1.0, 48);
  geo.rotateX(-Math.PI / 2); // lie flat (XZ plane)
  var mat = new THREE.MeshBasicMaterial({
    color: _s_ICE, transparent: true,
    opacity: 0.95, side: THREE.DoubleSide, depthWrite: false
  });
  var ring = new THREE.Mesh(geo, mat);
  ring.position.y = 0.06;
  ring.scale.set(0.05, 1, 0.05);
  var light = new THREE.PointLight(_s_ICE, 2.5, 8);
  // Local x=0.95 scales with the ring, so the light sits on the leading edge
  // as it expands; local y=0.9 floats it just under a meter off the floor.
  light.position.set(0.95, 0.9, 0);
  ring.add(light);
  grp.add(ring);
  grp.position.set(c.x, 0, c.z);
  W3.ringGroup.add(grp);
  _s_pulses.push({
    grp: grp, ring: ring, mat: mat, light: light,
    t: 0, ringDur: 0.9, dur: C.SONAR_REVEAL_T,
    maxR: C.SONAR_REVEAL_R * C.TILE3D
  });
}

/* --------------------------------------------- rings (3D expanding) -- */
// Flat expanding ring at floor level. maxR in tiles; color hex; dur seconds.
function addRing3D(tx, ty, maxR, color, dur, op) {
  var c = _s_tileCenter(tx, ty);
  var geo = new THREE.RingGeometry(0.9, 1.0, 48);
  geo.rotateX(-Math.PI / 2); // lie flat (XZ plane)
  var mat = new THREE.MeshBasicMaterial({
    color: color, transparent: true,
    opacity: (op === undefined ? 0.9 : op),
    side: THREE.DoubleSide, depthWrite: false
  });
  var mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(c.x, 0.06, c.z);
  mesh.scale.set(0.05, 1, 0.05);
  mesh.userData.op0 = mat.opacity; // initial opacity, for the fade
  W3.ringGroup.add(mesh);
  _s_rings3d.push({ mesh: mesh, t: 0, dur: dur, maxR: maxR * C.TILE3D });
}

// Animate rings (scale 0 -> maxR tiles, opacity fade with distance so they
// melt into the fog), sonar pulses (ring + traveling light), throw tracers,
// and mirror any new 2D-style G.rings entries into faint 3D rings.
function updateRings3D(dt) {
  // Mirror ring events that came from elsewhere (e.g. emitNoise's faint
  // footstep rings) into faint amber 3D rings. Entries created directly by
  // doSonar3D/throwFacing3D carry _m3d and are skipped (no doubles).
  if (G.rings) {
    for (var i = 0; i < G.rings.length; i++) {
      var r = G.rings[i];
      if (!r._m3d) {
        r._m3d = true;
        var sonar = r.kind === 'sonar';
        addRing3D(r.x, r.y, r.maxR, sonar ? _s_ICE : _s_AMBER,
                  r.dur || 0.7, sonar ? 0.95 : 0.35);
      }
    }
  }

  // Generic expanding rings.
  for (var j = _s_rings3d.length - 1; j >= 0; j--) {
    var ring = _s_rings3d[j];
    ring.t += dt;
    var k = ring.t / ring.dur;
    if (k >= 1) {
      _s_dispose(ring.mesh);
      _s_rings3d.splice(j, 1);
      continue;
    }
    var s = Math.max(0.05, ring.maxR * k);
    ring.mesh.scale.set(s, 1, s);
    // Time fade x distance melt: exponential falloff matched to the scene's
    // FogExp2 density (0.055) so the ring dissolves into the fog as it runs.
    ring.mesh.material.opacity = ring.mesh.userData.op0 * (1 - k) * Math.exp(-0.055 * s);
  }

  // Sonar pulses: the ring expands over ringDur and pins at max radius while
  // the traveling light fades 2.5 -> 0 across the full reveal window.
  for (var p = _s_pulses.length - 1; p >= 0; p--) {
    var pu = _s_pulses[p];
    pu.t += dt;
    var pk = pu.t / pu.dur;
    if (pk >= 1) {
      _s_dispose(pu.grp);
      _s_pulses.splice(p, 1);
      continue;
    }
    var rk = Math.min(1, pu.t / pu.ringDur);
    var ps = Math.max(0.05, pu.maxR * rk);
    pu.ring.scale.set(ps, 1, ps);
    pu.light.intensity = 2.5 * (1 - pk);
    pu.mat.opacity = 0.95 * (1 - pk) * Math.exp(-0.055 * ps);
  }

  // Throw tracers: quick pop-and-fade flash at the landing tile.
  for (var m = _s_tracers.length - 1; m >= 0; m--) {
    var tr = _s_tracers[m];
    tr.t += dt;
    var kk = tr.t / tr.dur;
    if (kk >= 1) {
      _s_dispose(tr.mesh);
      _s_tracers.splice(m, 1);
      continue;
    }
    var sc = 1 + 2.2 * kk;
    tr.mesh.scale.set(sc, sc, sc);
    tr.mesh.material.opacity = 1 - kk;
  }
}

/* -------------------------------------------- keycards (3D pickups) -- */
// Lab-tech keycards: a dark card body with an amber emissive face (glows in
// the dark) plus a mag stripe and a pale chip so it reads as lab equipment
// up close. Lambert material responds to the sonar pulse's traveling light,
// so the card's amber glint catches the wavefront. Slow bob + spin.
// Meshes align with G.keycards by index; hidden when taken.
function buildKeycards3D() {
  for (var i = 0; i < W3.keyMeshes.length; i++) _s_dispose(W3.keyMeshes[i]);
  W3.keyMeshes = [];
  for (var k = 0; k < G.keycards.length; k++) {
    var kc = G.keycards[k];
    var c = _s_tileCenter(kc.x, kc.y);
    var grp = new THREE.Group();
    var body = new THREE.Mesh(
      new THREE.BoxGeometry(0.52, 0.045, 0.34),
      new THREE.MeshLambertMaterial({ color: 0x6b4a10, emissive: _s_AMBER, emissiveIntensity: 0.75 })
    );
    // Mag stripe across the top.
    var stripe = new THREE.Mesh(
      new THREE.BoxGeometry(0.52, 0.014, 0.09),
      new THREE.MeshBasicMaterial({ color: 0x141414 })
    );
    stripe.position.set(0, 0.026, -0.095);
    // Pale contact chip.
    var chip = new THREE.Mesh(
      new THREE.BoxGeometry(0.09, 0.014, 0.07),
      new THREE.MeshBasicMaterial({ color: 0xE8E4D8 })
    );
    chip.position.set(-0.15, 0.026, 0.075);
    grp.add(body);
    grp.add(stripe);
    grp.add(chip);
    grp.position.set(c.x, 1.15, c.z);
    grp.userData.phase = k * 1.7; // bob offset per card
    W3.scene.add(grp);
    W3.keyMeshes.push(grp);
  }
}

function syncKeycards3D(dt) {
  for (var i = 0; i < W3.keyMeshes.length; i++) {
    var mesh = W3.keyMeshes[i];
    var kc = G.keycards[i];
    if (!kc) { mesh.visible = false; continue; }
    mesh.visible = !kc.taken;
    if (!mesh.visible) continue;
    // Bob on the fixed-rate game clock; spin is time-scaled (dt), so both
    // read identically at any frame rate.
    mesh.position.y = 1.15 + Math.sin(G.time * 2.2 + mesh.userData.phase) * 0.09;
    mesh.rotation.y += dt * 1.4; // slow spin
  }
}

/* --------------------------------- keycard readers + exit door (3D) -- */
// A reader: small dark wall box + emissive dot (red = locked, green =
// unlocked). The brief's #1 prop — it teaches the game's core verb.
function _s_makeReader() {
  var grp = new THREE.Group();
  var box = new THREE.Mesh(
    new THREE.BoxGeometry(0.12, 0.26, 0.2),
    new THREE.MeshLambertMaterial({ color: 0x14171c })
  );
  var dot = new THREE.Mesh(
    new THREE.SphereGeometry(0.035, 8, 6),
    new THREE.MeshBasicMaterial({ color: _s_RED })
  );
  dot.position.set(-0.075, 0.04, 0); // on the -x face
  grp.add(box);
  grp.add(dot);
  _s_readerDots.push(dot.material);
  return grp;
}

// Mount a reader on the face of wall tile (wx,wy), looking into floor tile
// (fx,fy). parent/ox/oz are the exit group's handle and origin offset.
function _s_mountReader(fx, fy, wx, wy, parent, ox, oz) {
  var wc = worldFromTile(wx, wy);
  var dx = fx - wx, dz = fy - wy; // unit step from the wall into the corridor
  var reader = _s_makeReader();
  // Rotate so the dot's -x face points along (dx,dz) into the corridor.
  reader.rotation.y = Math.atan2(dz, -dx);
  reader.position.set(
    ox + wc.x + dx * (C.TILE3D / 2 - 0.08),
    1.55,
    oz + wc.z + dz * (C.TILE3D / 2 - 0.08)
  );
  parent.add(reader);
}

// Readers at prominent doorway/junction positions around the map.
function _s_buildJunctionReaders(parent, ox, oz) {
  var dirs = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  for (var i = 0; i < _s_READER_SPOTS.length; i++) {
    var fx = _s_READER_SPOTS[i][0], fy = _s_READER_SPOTS[i][1];
    if (!_s_isFloor(fx, fy)) continue;
    for (var d = 0; d < 4; d++) {
      var wx = fx + dirs[d][0], wy = fy + dirs[d][1];
      if (_s_inBounds(wx, wy) && G.grid[wy][wx] === 1) {
        _s_mountReader(fx, fy, wx, wy, parent, ox, oz);
        break;
      }
    }
  }
}

// Procedural EXIT sign texture: green backlit lettering on near-black.
function _s_makeExitSignTexture() {
  var cv = document.createElement('canvas');
  cv.width = 256; cv.height = 96;
  var g = cv.getContext('2d');
  g.fillStyle = '#05070A';
  g.fillRect(0, 0, 256, 96);
  g.strokeStyle = '#232a34';
  g.lineWidth = 5;
  g.strokeRect(5, 5, 246, 86);
  g.font = 'bold 54px "Courier New", monospace';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = '#3dff73';
  g.shadowBlur = 16;
  g.fillStyle = '#3dff73';
  g.fillText('EXIT', 128, 52);
  return new THREE.CanvasTexture(cv);
}

// Procedural hazard striping (brief §4 recipe): 128² canvas, diagonal 45°
// stripes alternating amber #F5A524 / near-black #141414, 16px each.
function _s_makeHazardTexture() {
  var cv = document.createElement('canvas');
  cv.width = 128; cv.height = 128;
  var g = cv.getContext('2d');
  g.fillStyle = '#141414';
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#F5A524';
  g.save();
  g.translate(64, 64);
  g.rotate(Math.PI / 4);
  g.translate(-64, -64);
  for (var x = -128; x < 256; x += 32) g.fillRect(x, -64, 16, 256);
  g.restore();
  return new THREE.CanvasTexture(cv);
}

// Door frame (two posts + lintel) + thin door slab + backlit EXIT sign +
// hazard-striped threshold + two flanking keycard readers (double door gets
// two) + junction readers around the map. Locked: deep red with a slight
// flicker. Open (3/3): green with a glow pulse; sign lights; reader dots
// flip red -> green.
function buildExit3D() {
  if (W3.exitMesh) { _s_dispose(W3.exitMesh); W3.exitMesh = null; }
  _s_readerDots = [];
  var c = _s_tileCenter(G.exit.x, G.exit.y);
  var grp = new THREE.Group();
  var ox = -c.x, oz = -c.z; // children below use world coords minus group origin

  var frameMat = new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: 0.8 });
  var postGeo = new THREE.BoxGeometry(0.35, C.WALL_H, 0.35);
  var postL = new THREE.Mesh(postGeo, frameMat);
  postL.position.set(ox + c.x, C.WALL_H / 2, oz + c.z - 1.05);
  var postR = new THREE.Mesh(postGeo, frameMat);
  postR.position.set(ox + c.x, C.WALL_H / 2, oz + c.z + 1.05);
  var lintel = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.32, 2.45),
    frameMat
  );
  lintel.position.set(ox + c.x, C.WALL_H - 0.16, oz + c.z);
  grp.add(postL);
  grp.add(postR);
  grp.add(lintel);

  // Thin door slab facing the west approach corridor (DoubleSide-readable
  // from every angle since it has real thickness).
  var door = new THREE.Mesh(
    new THREE.BoxGeometry(0.16, 2.85, 1.8),
    new THREE.MeshBasicMaterial({ color: _s_RED })
  );
  door.position.set(ox + c.x, 1.425, oz + c.z);
  door.userData.isDoor = true;
  grp.add(door);
  grp.userData.door = door;

  // BACKLIT EXIT sign above the lintel. Stays DARK until 3/3 keycards, then
  // lights green — "the promised land, visible from afar".
  var signMat = new THREE.MeshBasicMaterial({
    map: _s_makeExitSignTexture(), side: THREE.DoubleSide
  });
  signMat.color.setHex(0x0e0e0e); // dark while locked
  var sign = new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.62), signMat);
  sign.rotation.y = -Math.PI / 2; // face the west approach corridor
  sign.position.set(ox + c.x, C.WALL_H + 0.38, oz + c.z);
  grp.add(sign);
  grp.userData.signMat = signMat;

  // Hazard striping at the door threshold.
  var hzTex = _s_makeHazardTexture();
  hzTex.wrapS = hzTex.wrapT = THREE.RepeatWrapping;
  hzTex.repeat.set(2, 1);
  var hz = new THREE.Mesh(
    new THREE.PlaneGeometry(2.2, 0.9),
    new THREE.MeshBasicMaterial({ map: hzTex })
  );
  hz.rotation.x = -Math.PI / 2;
  hz.position.set(ox + c.x - 1.35, 0.02, oz + c.z);
  grp.add(hz);

  // Two readers flanking the double door, mounted on the frame posts.
  // The dot's -x face already points west (the approach) — no rotation needed.
  var rL = _s_makeReader();
  rL.position.set(ox + c.x - 0.245, 1.55, oz + c.z - 1.05);
  grp.add(rL);
  var rR = _s_makeReader();
  rR.position.set(ox + c.x - 0.245, 1.55, oz + c.z + 1.05);
  grp.add(rR);

  // Readers at prominent doorway/junction positions around the map.
  _s_buildJunctionReaders(grp, ox, oz);

  grp.position.set(c.x, 0, c.z);
  W3.scene.add(grp);
  W3.exitMesh = grp;
}

function syncExit3D() {
  if (!W3.exitMesh || !W3.exitMesh.userData.door) return;
  var ud = W3.exitMesh.userData;
  var door = ud.door;
  if (G.exit.open) {
    // Unlocked: green with a brighter glow pulse.
    var pulse = 0.85 + 0.35 * Math.sin(G.time * 3.0);
    door.material.color.setHex(_s_GREEN).multiplyScalar(Math.min(1.2, pulse));
  } else {
    // Locked: deep red with a slight uneven flicker.
    var fl = 0.62 + 0.22 * Math.sin(G.time * 13.0) + 0.08 * Math.sin(G.time * 47.0);
    door.material.color.setHex(_s_RED).multiplyScalar(Math.max(0.3, fl));
  }
  // EXIT sign: dark until 3/3, then backlit green.
  if (ud.signMat) ud.signMat.color.setHex(G.exit.open ? 0xffffff : 0x0e0e0e);
  // Keycard reader dots flip red -> green along with the exit unlock.
  var dotHex = G.exit.open ? _s_GREEN : _s_RED;
  for (var i = 0; i < _s_readerDots.length; i++) {
    _s_readerDots[i].color.setHex(dotHex);
  }
}

/* -------------------------------------------- throw (3D distraction) - */
// Q / F / click-while-pointer-locked: throw 4 tiles in the facing direction
// (facing quantized from yaw). Same validation as 2D: Manhattan <= 5, floor,
// line-of-sight, and an item left. Invalid -> soft bonk, NOT consumed.
function throwFacing3D() {
  if (G.state !== 'PLAY') return;
  if (G.throwsLeft <= 0) { Sfx.bonk(); return; }
  var pt = _s_playerTile();
  var d = _s_faceDir();
  var tx = pt.x + d.dx * 4, ty = pt.y + d.dy * 4;
  var ok = (Math.abs(tx - pt.x) + Math.abs(ty - pt.y)) <= C.THROW_RANGE &&
           _s_isFloor(tx, ty) &&
           hasLOS(pt.x, pt.y, tx, ty);
  if (!ok) { Sfx.bonk(); return; }
  G.throwsLeft--;
  G.throwsUsed++;

  // Small arc tracer: a glowing amber puff that pops at the landing tile.
  var c = _s_tileCenter(tx, ty);
  var flash = new THREE.Mesh(
    new THREE.SphereGeometry(0.16, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0xFFD24D, transparent: true, opacity: 1 })
  );
  flash.position.set(c.x, 0.6, c.z);
  W3.scene.add(flash);
  _s_tracers.push({ mesh: flash, t: 0, dur: 0.35 });

  // Landing ring: the sonar ring mesh re-skinned in distraction amber.
  addRing3D(tx, ty, C.THROW_NOISE_R, _s_AMBER, 0.8, 0.8);
  G.rings.push({ x: tx, y: ty, r: 0, maxR: C.THROW_NOISE_R, t: 0, dur: 0.8,
                 kind: 'noise', color: '#ffd24d', _m3d: true });
  emitNoise(tx, ty, C.THROW_NOISE_R, C.THROW_SUSP);
  Sfx.clatter();
}

/* --------------------------------------------- radio (3D distraction) */
// E: drop a radio at the player's tile. Out of radios -> soft bonk.
// Positional audio hooks (setRadioPos on drop, radioStatic on/off) are
// tracked in _s_syncRadioFx and guarded — the audio worker owns them.
function placeRadio3D() {
  if (G.state !== 'PLAY') return;
  if (G.radiosLeft <= 0) { Sfx.bonk(); return; }
  var pt = _s_playerTile();
  G.radios.push({ tx: pt.x, ty: pt.y, t: C.RADIO_LIFE, tick: 0 });
  G.radiosLeft--;
  G.radiosUsed++;
  Sfx.radioDrop();
}

function _s_rebuildRadioMeshes() {
  for (var i = 0; i < W3.radioMeshes.length; i++) _s_dispose(W3.radioMeshes[i]);
  W3.radioMeshes = [];
  for (var k = 0; k < G.radios.length; k++) {
    var r = G.radios[k];
    var c = _s_tileCenter(r.tx, r.ty);
    var grp = new THREE.Group();
    var box = new THREE.Mesh(
      new THREE.BoxGeometry(0.36, 0.22, 0.26),
      new THREE.MeshStandardMaterial({ color: 0x17181c, roughness: 0.7 })
    );
    box.position.y = 0.11;
    // Short antenna stub — original silhouette so it reads as a radio.
    var ant = new THREE.Mesh(
      new THREE.CylinderGeometry(0.02, 0.02, 0.5, 6),
      new THREE.MeshStandardMaterial({ color: 0x3a3d44, roughness: 0.6 })
    );
    ant.position.set(-0.12, 0.42, 0);
    // Blinking red LED on top.
    var led = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0x440000 })
    );
    led.position.set(0.1, 0.26, 0);
    led.userData.isLed = true;
    grp.add(box);
    grp.add(ant);
    grp.add(led);
    grp.position.set(c.x, 0, c.z);
    grp.userData = { led: led, prevTick: 0, flash: 0 };
    W3.scene.add(grp);
    W3.radioMeshes.push(grp);
  }
}

// Track radio lifetimes for the positional-audio hooks: setRadioPos on drop,
// radioStatic on start, end (battery dead), and smash (removed by the
// creature). All guarded — no-ops until the audio worker implements them.
function _s_syncRadioFx() {
  if (typeof Sfx === 'undefined') return;
  var canPos = !!Sfx.setRadioPos, canStatic = !!Sfx.radioStatic;
  if (!canPos && !canStatic) { _s_radioFx.length = 0; return; }
  var i, j, e, c;
  for (i = 0; i < G.radios.length; i++) {
    var r = G.radios[i];
    e = null;
    for (j = 0; j < _s_radioFx.length; j++) {
      if (_s_radioFx[j].r === r) { e = _s_radioFx[j]; break; }
    }
    c = _s_tileCenter(r.tx, r.ty);
    if (!e) {
      _s_radioFx.push({ r: r, idx: i });
      if (canPos) Sfx.setRadioPos(i, c.x, 0.25, c.z);
      if (canStatic) Sfx.radioStatic(i, true);
    } else if (e.idx !== i) {
      // Index shifted after a splice — move the static panner along.
      if (canStatic) Sfx.radioStatic(e.idx, false);
      e.idx = i;
      if (canPos) Sfx.setRadioPos(i, c.x, 0.25, c.z);
      if (canStatic) Sfx.radioStatic(i, true);
    }
  }
  for (i = _s_radioFx.length - 1; i >= 0; i--) {
    var alive = false;
    for (j = 0; j < G.radios.length; j++) {
      if (_s_radioFx[i].r === G.radios[j]) { alive = true; break; }
    }
    if (!alive) {
      if (canStatic) Sfx.radioStatic(_s_radioFx[i].idx, false);
      _s_radioFx.splice(i, 1);
    }
  }
}

// Small dark box + blinking red LED per active radio. The LED fires a bright
// flash on each emission tick (detected via the tick counter resetting to 0)
// over a fixed-rate idle blink driven by the game clock (~1.2 Hz — identical
// at any frame rate).
function syncRadios3D(dt) {
  if (!G.radios) return;
  if (W3.radioMeshes.length !== G.radios.length) _s_rebuildRadioMeshes();
  for (var i = 0; i < W3.radioMeshes.length; i++) {
    var grp = W3.radioMeshes[i];
    var r = G.radios[i];
    if (!r) { grp.visible = false; continue; }
    grp.visible = true;
    var u = grp.userData;
    if (r.tick < u.prevTick - 0.0001) u.flash = 1; // tick fired -> bright flash
    u.prevTick = r.tick;
    u.flash = Math.max(0, u.flash - dt * 2.0);
    var blink = 0.5 + 0.5 * Math.sin(G.time * 7.5); // fixed-rate idle blink
    var f = Math.max(u.flash, blink * 0.35);
    // Dim idle red -> bright red flash on tick.
    u.led.material.color.setRGB(0.27 + 0.73 * f, 0.02 + 0.13 * f, 0.02 + 0.13 * f);
  }
  _s_syncRadioFx();
}

/* ------------------------------------------- start map reveal (3D) ---- */
// HERO SHOT #1 — the opening beat, one-time only per run: emergency lights
// stutter on for 2.5 s so the whole lab snaps into view, then die one by one
// and darkness swallows it. If the world worker provides the light-rig
// version (Lab.revealBeat), it plays; the full-bright tile stamp below is the
// fallback and drives render3D's reveal lighting either way.
function startMapReveal() {
  if (!G.reveal || G.mapRevealed) return; // one-time only
  if (typeof Lab !== 'undefined' && Lab.revealBeat) Lab.revealBeat();
  for (var i = 0; i < C.W * C.H; i++) G.reveal[i] = G.time;
  G.mapRevealed = true;
}

/* ------------------------------------------------- v3: lab notes ------ */
// 5 scattered readable notes telling the lab's backstory. Walk within
// NOTE_READ_R tiles + press F to read (phosphor-terminal overlay).
// Positions are hand-picked floor tiles near thematic landmarks.
var NOTES = [
  { x: 3, y: 1, title: 'SHIFT LOG — DR. ARORA',
    text: 'Day 14. The resonance array is finally stable. Subject 7 ' +

  { x: 4, y: 4, title: 'INCIDENT REPORT 7 — PARTIAL',
