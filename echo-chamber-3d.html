<script src="three.min.js"></script>
<script>

// Echo Chamber 3D — world.js
// WORLD worker: defines C, G, LEVEL, W3. Implements initThree, buildMaze3D,
// initLevel3D, updatePlayer3D, tileFromWorld, worldFromTile, render3D, and the
// global input bindings (keyboard + pointer-lock mouse look). Also builds the
// abandoned-research-laboratory environment (lighting rig, procedural canvas
// textures, props, dust, containment chamber) and exposes the shared Lab API:
//   Lab.setHuntMode(on), Lab.revealBeat(), Lab.dustBurst(x, z).
// Plain script (no modules). Loaded BEFORE creature.js, systems.js, audioui.js,
// main.js — those files REFERENCE these names and must never redeclare them.
// All geometry/logic below is ORIGINAL (written fresh for this jam).
// References (defined elsewhere, never redeclared here):
//   Sfx, Tut, emitNoise, startMapReveal, doSonar3D, throwFacing3D, placeRadio3D,
//   buildKeycards3D, syncKeycards3D, buildExit3D, syncExit3D, syncRadios3D,
//   updateRings3D

// ---------------------------------------------------------------- C ----
// 2D values copied verbatim from build/core.js, then the 3D additions.
const C = {
  TILE: 40, W: 15, H: 11,           // 2D canvas play area 600x440 (kept for parity)
  SONAR_REVEAL_R: 6,                // tiles (Euclidean)
  SONAR_REVEAL_T: 2.5,              // seconds of visibility
  SONAR_CD: 4,                      // seconds cooldown
  SONAR_NOISE_R: 8,                 // noise emitted — larger than reveal
  P_SPEED: 4.0,                     // tiles/sec normal
  Q_SPEED: 2.4,                     // tiles/sec quiet (Shift)
  P_NOISE_R: 3, Q_NOISE_R: 1,       // noise radius per tile entered
  P_SUSP: 12, Q_SUSP: 4,            // suspicion per step
  C_ROAM_SPD: 1.8, C_INV_SPD: 3.0, C_HUNT_SPD: 3.85,   // tiles/sec
  C_TICK_ROAM: 0.55, C_TICK_INV: 0.33, C_TICK_HUNT: 0.26, // seconds per creature step
  VISION_R: 2,                      // creature vision (Bresenham LOS)
  CAPTURE_D: 0.6,                   // tiles — capture distance
  SUSP_MAX: 100, SUSP_DECAY: 8, SUSP_DECAY_HIDDEN: 20, // per second
  SUSP_INVESTIGATE: 40, SUSP_HUNT: 100, SUSP_DROP: 35, // thresholds
  PULSE_SUSP: 70, THROW_SUSP: 40, RADIO_SUSP: 25,
  THROW_N: 3, THROW_RANGE: 5, THROW_NOISE_R: 5,  // Manhattan range, needs LOS
  RADIO_N: 2, RADIO_TICK_R: 4, RADIO_TICK_T: 2, RADIO_LIFE: 12, // seconds
  HIDE_T: 1.5,                      // still seconds -> hidden
  BASE_SIGHT: 2.5,                  // always-on dim awareness radius (tiles)
  // --- v3 feature additions ---
  SPRINT_SPEED: 5.6,                // tiles/sec sprint (double-tap-hold move key)
  SPRINT_NOISE_R: 5, SPRINT_SUSP: 20,
  STAM_MAX: 100, STAM_DRAIN: 22, STAM_REGEN: 14, // per second
  PANT_BELOW: 30,                   // stamina below this -> audible panting
  PANT_EVERY: 1.6,                  // seconds between pant noises
  PANT_NOISE_R: 2, PANT_SUSP: 8,
  NOTE_READ_R: 1.7,                 // tiles — note read radius
  PROX_FLICK_R: 6,                  // tiles — creature proximity flicker radius
  INTRO_LEN: 7.5,                   // seconds
  KEYS_NEED: 3,
  // 3D additions
  TILE3D: 4,                        // 1 tile = 4 world units
  EYE_H: 1.7,                       // camera eye height standing
  CROUCH_H: 0.95,                   // camera eye height crouched
  WALL_H: 3.2,                      // wall box height
  P_RADIUS: 0.35,                   // player collision radius (world units)
};

// ---------------------------------------------------------------- G ----
const G = {
  state: 'TITLE',            // TITLE | HOWTO | PLAY | PAUSE | WIN | LOSE
  grid: [],                  // [y][x]: 0 floor, 1 wall (parsed from LEVEL)
  player: { x:1, y:1, moving:false, fx:1, fy:1, tx:1, ty:1, prog:0,
            quiet:false, hidden:false, stillT:0, faceX:1, faceY:0,
            yaw:0, pitch:0, crouch:false },   // x,y are CONTINUOUS tile coords
  creature: { x:6, y:4, cstate:'ROAM', susp:0, tgt:null, path:[],
              tickT:0, lookT:0, searchT:0, stuckN:0, smashT:0 },
  keycards: [],              // [{x,y,taken}]
  exit: { x:13, y:6, open:false },
  radios: [],                // [{tx,ty,t,tick}] active radios, t counts down
  throwsLeft: 3, radiosLeft: 2,
  keys: 0,                   // keycards collected (KEPT across restarts)
  pulseCd: 0,
  reveal: null,              // Float32Array(W*H) of reveal timestamps (seconds, G.time)
  rings: [],                 // visual ring events (systems.js mirrors into 3D meshes)
  noises: [],                // processed stimulus queue [{tx,ty,susp}]
  time: 0,                   // seconds since level start (this attempt)
  totalTime: 0,
  pulsesUsed: 0, throwsUsed: 0, radiosUsed: 0, timesSpotted: 0,
  loseReason: '',            // epitaph key for lose screen
  muted: false,
  heardFlash: 0,             // HUD "HEARD" flicker timer
  mapRevealed: false,        // one-time start reveal done
  // --- v3 feature state ---
  stamina: 100,              // sprint stamina 0..100
  sprinting: false,          // double-tap-hold sprint active
  pantT: 0,                  // panting noise timer
  nearNote: -1,              // index of readable note in range, -1 none
  noteOpen: -1,              // index of open note overlay, -1 none
  angerFlash: 0,             // "IT IS ANGRIER" HUD timer on keycard pickup
};
G.reveal = new Float32Array(C.W * C.H);
G.reveal.fill(-1e3);         // unrevealed sentinel (avoids a full-map flash at t=0)

// ------------------------------------------------------------- LEVEL ---
const LEVEL = [
  "###############",
  "#P.....#...#1.#",
  "#.#....#..#.#.#",
  "#.#...........#",
  "#.....C#......#",
  "###.#######.###",
  "#......#.....E#",
  "#.#.........#.#",
  "#.#....#....#.#",
  "#2.....#....3.#",
  "###############",
];

// --------------------------------------------------------------- W3 ----
const W3 = {
  scene: null, camera: null, renderer: null,
  wallMats: [],      // [y][x] wall material or null (individual per tile)
  floorMats: [],     // [y][x] floor material (individual per tile)
  creatureGroup: null,
  keyMeshes: [],
  exitMesh: null,
  radioMeshes: [],
  ringGroup: null,
  playerLight: null,
};

// ------------------------------------------- lab palette (exact hex) ---
// Art-direction brief: never more than two accent colors in one frame
// (cyan + amber, or red + cyan). Eyes of the creature are NOT red here —
// the creature worker owns that (amber #FF7A1A); this file tints nothing
// creature-related.
var LAB = {
  VOID: 0x05070A, STEEL: 0x8A939B, TILE: 0xD8DDE0, CYAN: 0x7FD4E8,
  ICE: 0xBFEFFF, AMBER: 0xF5A524, RED: 0xC0392B, BONE: 0xE8E4D8, FOG: 0x0B1220,
};

// ------------------------------------------------- private world state --
var _held = {};        // key code -> true while physically held
var _audioReady = false;
var _eyeH = C.EYE_H;   // lerped camera eye height (crouch transition)
var _curTileX = 1, _curTileY = 1;  // last tile the player occupied (step events)
var _lastRender = 0;
var _seed = 1337;      // deterministic PRNG for wall-height jitter

// ---- lab private state (environment visuals, lighting rig, Lab API) ---
var _ambient = null;          // AmbientLight ref (hunt mode dims it)
var _labGroup = null;         // all lab prop meshes (dispose-on-rebuild)
var _labDisposables = [];     // GPU resources tracked for rebuild disposal
var _labBuilt = false;
var _tex = {};                // shared procedural canvas textures
var _roomAnchors = [];        // 9 room light anchor world positions
var _roomPool = [];           // 4 PointLights (nearest-4 active; flicker borrows one)
var _flickSpots = [];         // 3 flickering-tube tile world positions
var _flickTubeMat = null;     // shared emissive material for flicker troffers
var _flickNear = false;       // player within buzz/light range of a flicker tube
var _flickWX = 0, _flickWZ = 0; // nearest flicker tube world pos (for buzz)
var _flickFrame = 0;          // buzz throttled to every other frame
var _FLICK = "mmnmmommommnonmmonqnmmo";  // Quake-style patterned flicker
var _flickIdx = 0, _flickAcc = 0, _flickLvl = 1;
var _monAcc = 0;              // monitor rolling-band clock
var _roomAcc = 0;             // nearest-4 light re-eval clock (~2x/sec)
var _huntT = 0, _huntTarget = 0;  // emergency-state lerp 0..1 (~1.5 s)
var _cBase = null, _cHunt = null; // room light colors: 0xBFD9E8 -> 0xC0392B
var _beatPhase = 'idle';      // revealBeat state machine: idle|stutter|die
var _beatT = 0, _beatAcc = 0, _beatOrder = [], _beatDone = false;
var _exitDotMat = null;       // keycard reader dot by the exit (red->green)
var _dust = null, _dustGeo = null, _dustVel = null;
var _burst = null, _burstPts = null, _burstVel = null, _burstLife = 0, _burstMax = 1.2;
// shared lab materials (tracked, never disposed while in use)
var _labSteelMat = null, _labDarkMat = null, _conduitMat = null,
    _paperMat = null, _bioMat = null, _bloodMat = null,
    _monDeadMat = null, _monFlickMat = null, _hazMat = null,
    _tapeMat = null, _ceilMat = null;

function _rand() {
  _seed = (_seed * 1103515245 + 12345) & 0x7fffffff;
  return _seed / 0x7fffffff;
}

function _ensureAudio() {
  if (!_audioReady && typeof Sfx !== 'undefined' && Sfx.init) {
    Sfx.init();
    _audioReady = true;
  }
}

function _inBounds(x, y) { return x >= 0 && y >= 0 && x < C.W && y < C.H; }
function _isFloor(x, y) { return _inBounds(x, y) && G.grid[y][x] === 0; }

// Track a GPU resource (texture / geometry / material) for dispose-on-rebuild.
function _track(d) { _labDisposables.push(d); return d; }

// ------------------------------------------------------- tile <-> world
function tileFromWorld(wx, wz) {
  return { tx: Math.floor(wx / C.TILE3D), ty: Math.floor(wz / C.TILE3D) };
}
function worldFromTile(tx, ty) {
  return { x: (tx + 0.5) * C.TILE3D, z: (ty + 0.5) * C.TILE3D };
}

// ------------------------------------------------------------ initThree
function _webglFail(msg) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;' +
    'justify-content:center;background:#05070a;color:#e8e4d8;' +
    'font:16px/1.6 system-ui,sans-serif;text-align:center;z-index:9999;padding:24px;';
  d.textContent = 'ECHO CHAMBER 3D needs WebGL to run. (' + msg + ')';
  document.body.appendChild(d);
}

function initThree() {
  if (typeof THREE === 'undefined') { _webglFail('three.min.js not loaded'); return false; }
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    if (!renderer.getContext()) throw new Error('null context');
  } catch (err) {
    _webglFail('WebGL context creation failed');
    return false;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 1);
  renderer.domElement.id = 'game3d';
  document.body.appendChild(renderer.domElement);
  W3.renderer = renderer;
  // NO shadow maps, ever — fog + emissive + falloff carry the look.

  W3.scene = new THREE.Scene();
  W3.scene.fog = new THREE.FogExp2(LAB.FOG, 0.055);   // dread engine: blue-black by ~15 m

  W3.camera = new THREE.PerspectiveCamera(
    70, window.innerWidth / window.innerHeight, 0.1, 200);
  W3.camera.rotation.order = 'YXZ';
  W3.scene.add(W3.camera);

  // Cold barely-there ambient — shadows feel crushed, not soft.
  _ambient = new THREE.AmbientLight(0x1A2436, 0.35);
  W3.scene.add(_ambient);
  _cBase = new THREE.Color(0xBFD9E8);
  _cHunt = new THREE.Color(LAB.RED);

  // Dim cool light riding with the camera (~BASE_SIGHT reach).
  W3.playerLight = new THREE.PointLight(0x93a7bd, 0.45, 7);
  W3.camera.add(W3.playerLight);

  buildMaze3D();

  // Creature + ring groups live for the whole session; contents are rebuilt
  // by their owners when a level (re)starts.
  W3.creatureGroup = new THREE.Group();
  W3.scene.add(W3.creatureGroup);
  W3.ringGroup = new THREE.Group();
  W3.scene.add(W3.ringGroup);

  _bindPointerLock();
  window.addEventListener('resize', function () {
    W3.camera.aspect = window.innerWidth / window.innerHeight;
    W3.camera.updateProjectionMatrix();
    W3.renderer.setSize(window.innerWidth, window.innerHeight);
  });
  return true;
}

// ----------------------------------------------------------- buildMaze3D
function buildMaze3D() {
  _parseLevel();   // fills G.grid + spawn/entity positions
  _disposeLab();   // dispose-on-rebuild BEFORE creating fresh lab resources
  _buildLabTextures();

  var wallGeo = new THREE.BoxGeometry(C.TILE3D, C.WALL_H, C.TILE3D);
  var trimGeo = new THREE.BoxGeometry(C.TILE3D * 1.02, 0.07, C.TILE3D * 1.02);
  var trimMat = new THREE.MeshLambertMaterial({ color: 0x161b24 });
  var floorGeo = new THREE.PlaneGeometry(C.TILE3D, C.TILE3D);
  var ICE = 0x9fd8e8;

  W3.wallMats = [];
  W3.floorMats = [];
  for (var y = 0; y < C.H; y++) {
    W3.wallMats[y] = [];
    W3.floorMats[y] = [];
    for (var x = 0; x < C.W; x++) {
      var c = worldFromTile(x, y);

      // Floor on every tile — individual material so sonar can light it.
      // Sealed-concrete texture shared across all tiles.
      var fm = new THREE.MeshLambertMaterial({ map: _tex.concrete });
      fm.emissive = new THREE.Color(ICE);
      fm.emissiveIntensity = 0;
      var fl = new THREE.Mesh(floorGeo, fm);
      fl.rotation.x = -Math.PI / 2;
      fl.position.set(c.x, 0, c.z);
      W3.scene.add(fl);
      W3.floorMats[y][x] = fm;

      if (G.grid[y][x] === 1) {
        // Wall — individual material for per-tile sonar reveal. Lab wall
        // language baked into one shared texture: upper off-white tile,
        // thin emissive-cyan conduit strip at 2 m, lower brushed metal,
        // rubber seal at the base.
        var wm = new THREE.MeshLambertMaterial({ map: _tex.wall });
        wm.emissive = new THREE.Color(ICE);
        wm.emissiveIntensity = 0;
        var w = new THREE.Mesh(wallGeo, wm);
        // Subtle per-wall height jitter for an abandoned feel.
        var h = C.WALL_H + (_rand() * 0.3 - 0.15);
        w.scale.y = h / C.WALL_H;
        w.position.set(c.x, h / 2, c.z);
        W3.scene.add(w);
        W3.wallMats[y][x] = wm;

        // Subtle trim along the top edge of each wall.
        var t = new THREE.Mesh(trimGeo, trimMat);
        t.position.set(c.x, h + 0.035, c.z);
        W3.scene.add(t);
      } else {
        W3.wallMats[y][x] = null;
      }
    }
  }

  _buildLabVisuals();   // ceilings, troffers, room lights, props, dust
}

// Shared LEVEL parser: fills G.grid and the raw spawn/entity spots.
// Called once by buildMaze3D and again by every initLevel3D.
function _parseLevel() {
  G.grid = [];
  G.keycards = [];
  var px = 1, py = 1, cx = 6, cy = 4, ex = 13, ey = 6;
  for (var y = 0; y < C.H; y++) {
    G.grid[y] = [];
    for (var x = 0; x < C.W; x++) {
      var ch = LEVEL[y][x];
      G.grid[y][x] = (ch === '#') ? 1 : 0;
      if (ch === 'P') { px = x; py = y; }
      else if (ch === 'C') { cx = x; cy = y; }
      else if (ch === 'E') { ex = x; ey = y; }
      else if (ch === '1' || ch === '2' || ch === '3') {
        G.keycards.push({ x: x, y: y, taken: false });
      }
    }
  }
  G.player.x = px + 0.5; G.player.y = py + 0.5;
  G.creature.x = cx + 0.5; G.creature.y = cy + 0.5;
  G.exit.x = ex; G.exit.y = ey;
}

// ============================================= procedural canvas textures
// All original, all canvas -> CanvasTexture. RepeatWrapping, anisotropy 4,
// shared across meshes (individual materials stay per-tile for sonar reveal).
// Total texture memory well under 2 MB. Zero network requests.
function _newCanvas(w, h) {
  var c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function _finishTex(c, rx, ry) {
  var t = new THREE.CanvasTexture(c);
  t.wrapS = THREE.RepeatWrapping;
  t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  if (rx) t.repeat.set(rx, ry || rx);
  return _track(t);
}
// 1. Brushed metal: 400 horizontal 1px lines, alpha 0.04-0.12.
function _texBrushed() {
  var c = _newCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#8A939B'; g.fillRect(0, 0, 256, 256);
  for (var i = 0; i < 400; i++) {
    var y = (_rand() * 256) | 0, a = 0.04 + _rand() * 0.08;
    g.fillStyle = _rand() < 0.5 ? 'rgba(255,255,255,' + a + ')'
                                : 'rgba(0,0,0,' + a + ')';
    g.fillRect(0, y, 256, 1);
  }
  return _finishTex(c);
}
// 2. Lab tile recipe (kept for reference — the tile language is baked into
// the wall composite below): 64px grid in #B9BFC4 + 800 grime speckles.
function _texLabTile_UNUSED() {
  var c = _newCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#D8DDE0'; g.fillRect(0, 0, 256, 256);
  var tx, ty;
  for (ty = 0; ty < 4; ty++) for (tx = 0; tx < 4; tx++) {
    var v = (_rand() * 10 - 5) | 0;
    g.fillStyle = v > 0 ? 'rgba(255,255,255,' + (v / 100) + ')'
                        : 'rgba(0,0,0,' + (-v / 100) + ')';
    g.fillRect(tx * 64, ty * 64, 64, 64);
  }
  g.strokeStyle = '#B9BFC4'; g.lineWidth = 2;
  for (var i = 0; i <= 256; i += 64) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 256); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(256, i); g.stroke();
  }
  for (var s = 0; s < 800; s++) {
    g.fillStyle = 'rgba(0,0,0,' + (0.03 + _rand() * 0.04) + ')';
    g.fillRect((_rand() * 256) | 0, (_rand() * 256) | 0, 1, 1);
  }
  return _finishTex(c);
}
// 3. Hazard stripes: 45-degree amber/black, 16px.
function _texHazard() {
  var c = _newCanvas(128, 128), g = c.getContext('2d');
  g.fillStyle = '#141414'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#F5A524';
  for (var i = -128; i < 256; i += 32) {
    g.beginPath();
    g.moveTo(i, 0); g.lineTo(i + 16, 0);
    g.lineTo(i + 16 - 128, 128); g.lineTo(i - 128, 128);
    g.closePath(); g.fill();
  }
  return _finishTex(c);
}
// 4. Sealed concrete: 3000 speckle dots + 4 soft stain blotches.
function _texConcrete() {
  var c = _newCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#3A3F44'; g.fillRect(0, 0, 256, 256);
  for (var i = 0; i < 3000; i++) {
    g.fillStyle = _rand() < 0.5 ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.06)';
    g.fillRect((_rand() * 256) | 0, (_rand() * 256) | 0, 1, 1);
  }
  for (var b = 0; b < 4; b++) {
    var x = _rand() * 256, y = _rand() * 256, r = 30 + _rand() * 50;
    var rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, 'rgba(0,0,0,0.08)');
    rg.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  return _finishTex(c);
}
// 5. Biohazard trefoil decal (transparent), blood-red.
function _texBiohazard() {
  var c = _newCanvas(128, 128), g = c.getContext('2d');
  g.clearRect(0, 0, 128, 128);
  g.strokeStyle = '#C0392B'; g.fillStyle = '#C0392B'; g.lineWidth = 10;
  for (var k = 0; k < 3; k++) {
    var a0 = -Math.PI / 2 + k * 2 * Math.PI / 3;
    g.beginPath(); g.arc(64, 64, 38, a0 - 0.5, a0 + 0.5); g.stroke();
  }
  g.beginPath(); g.arc(64, 64, 10, 0, 7); g.fill();
  return _finishTex(c);
}
// 6a. Monitor screen (dead): near-black + faint scanlines.
function _texMonitorDead() {
  var c = _newCanvas(128, 128), g = c.getContext('2d');
  g.fillStyle = '#04070a'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = 'rgba(127,212,232,0.05)';
  for (var y = 0; y < 128; y += 3) g.fillRect(0, y, 128, 1);
  return _finishTex(c);
}
// 6b. Monitor screen (flicker variant): emissive cyan + rolling band
// (animated via texture.offset.y on a fixed-rate clock).
function _texMonitorFlick() {
  var c = _newCanvas(128, 128), g = c.getContext('2d');
  g.fillStyle = '#0a2a33'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = 'rgba(127,212,232,0.25)';
  for (var y = 0; y < 128; y += 3) g.fillRect(0, y, 128, 1);
  g.fillStyle = 'rgba(191,239,255,0.5)'; g.fillRect(0, 40, 128, 14);
  return _finishTex(c);
}
// 7. Paper: off-white, text lines, 2-3 redaction bars.
function _texPaper() {
  var c = _newCanvas(64, 64), g = c.getContext('2d');
  g.fillStyle = '#ddd8c8'; g.fillRect(0, 0, 64, 64);
  g.fillStyle = 'rgba(60,60,60,0.55)';
  for (var i = 0; i < 9; i++) g.fillRect(6, 8 + i * 6, 52, 1);
  g.fillStyle = 'rgba(10,10,10,0.85)';
  for (var b = 0; b < 3; b++)
    g.fillRect(6 + ((b * 17) % 30), 10 + ((b * 23) % 44), 16, 4);
  return _finishTex(c);
}
// Wall composite: upper off-white tile / cyan conduit strip at 2 m /
// lower brushed metal / rubber seal at base. 3.2 m maps to 256 px.
function _texWallComposite() {
  var c = _newCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = '#D8DDE0'; g.fillRect(0, 0, 256, 96);
  g.strokeStyle = '#B9BFC4'; g.lineWidth = 2;
  for (var i = 0; i <= 256; i += 64) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, 96); g.stroke();
  }
  g.beginPath(); g.moveTo(0, 48); g.lineTo(256, 48); g.stroke();

// ---- patterned flicker level from the Quake-style string (0..1) ------------
function _flickLevel() {
  var ch = _FLICK.charCodeAt(_flickIdx) - 97;   // a=0 .. z=25
  var l = (ch - 11) / 5;                        // m..q -> 0.2..1.0
  return l < 0 ? 0 : (l > 1 ? 1 : l);
}

// ---- nearest-4 room lights (re-evaluated ~2x/sec); flicker borrows a slot --
function _updateRoomLights() {
  if (!_labBuilt || _beatPhase !== 'idle') return;
  var px = G.player.x * C.TILE3D, pz = G.player.y * C.TILE3D;
  var fi = 0, fd = 1e18, f;
  for (f = 0; f < _flickSpots.length; f++) {
    var s = _flickSpots[f];
    var dx = s.x - px, dz = s.z - pz, d = dx * dx + dz * dz;
    if (d < fd) { fd = d; fi = f; }
  }
  _flickNear = fd < 256;   // within 16 world units
  _flickWX = _flickSpots[fi].x; _flickWZ = _flickSpots[fi].z;
  var order = [];
  for (var a = 0; a < _roomAnchors.length; a++) {
    var an = _roomAnchors[a];
    var ax = an.x - px, az = an.z - pz;
    order.push({ i: a, d: ax * ax + az * az });
  }
  order.sort(function (p, q) { return p.d - q.d; });
  for (var s2 = 0; s2 < 4; s2++) {
    var L = _roomPool[s2];
    if (s2 === 0 && _flickNear) {
      L.position.set(_flickWX, 2.45, _flickWZ);
      L.userData.flick = true;
    } else {
      var an2 = _roomAnchors[order[_flickNear ? s2 - 1 : s2].i];
      L.position.set(an2.x, 2.4, an2.z);
      L.userData.flick = false;
    }
  }
}

// ---- per-frame lab update: flicker, hunt lerp, beat, dust, burst, buzz ----
function _labTick(dt) {
  if (!_labBuilt) return;
  var playing = (G.state === 'PLAY');

  // Patterned flicker stepped on a fixed 90 ms clock — never per-frame,
  // so it reads identically at 60 Hz and 144 Hz.
  // v3: creature proximity boost — within PROX_FLICK_R tiles the tube
  // flickers faster and deeper (atmosphere AND warning signal).
  var _proxBoost = 0;

    var cdx = G.creature.x - G.player.x, cdz = G.creature.y - G.player.y;
    var cdist = Math.sqrt(cdx * cdx + cdz * cdz);

  }
  if (playing) {
    _flickAcc += dt * (1 + _proxBoost * 2.5);
    while (_flickAcc >= 0.09) {

    }
    _flickLvl = _flickLevel() * (1 - _proxBoost * 0.3);
  }

  var tb = 0.12 + 0.88 * _flickLvl;

  // Flickering monitor rolling band (own fixed-rate clock).
  _monAcc += dt;
  while (_monAcc >= 0.12) {
    _monAcc -= 0.12;

  }

  // Emergency-state lerp (~1.5 s): nearest light color -> blood red,
  // ambient 0.35 -> 0.2. Reverses when hunt mode turns off.
  _huntT += Math.max(-1, Math.min(1, _huntTarget - _huntT)) * Math.min(1, dt / 1.5);
  if (Math.abs(_huntTarget - _huntT) < 0.002) _huntT = _huntTarget;

  if (_beatPhase === 'stutter') {
    // HERO SHOT #1: emergency lights stutter on for 2.5 s.
    _beatT += dt; _beatAcc += dt;
    while (_beatAcc >= 0.1) {

    }
    _flickLvl = _flickLevel();
    var on = _flickLvl > 0.35;
    var spread = [0, 2, 5, 7];
    for (var s = 0; s < 4; s++) {
      var Ls = _roomPool[s], ans = _roomAnchors[spread[s]];
      Ls.position.set(ans.x, 2.4, ans.z);
      Ls.intensity = on ? 0.95 : 0.05;
      Ls.userData.flick = false;
      Ls.color.lerpColors(_cBase, _cHunt, _huntT);
    }
    _ambient.intensity = 0.55;
    if (_beatT >= 2.5) {

      _beatPhase = 'die'; _beatT = 0;
      var px = G.player.x * C.TILE3D, pz = G.player.y * C.TILE3D;
      _beatOrder = [0, 1, 2, 3].sort(function (a, b) {
        var da = _roomAnchors[spread[a]], db = _roomAnchors[spread[b]];
        var dda = (da.x - px) * (da.x - px) + (da.z - pz) * (da.z - pz);

      L.color.lerpColors(_cBase, _cHunt, _huntT);

  }

  // Keycard reader dot by the exit: red locked -> green open.
  if (_exitDotMat) {
    _exitDotMat.color.setHex(G.exit.open ? 0x2bd96a : 0xff3b30);
  }

  // Dust cloud: slow drift inside its 6 m box, box follows the player.
  if (_dust) {
    var dp = _dustGeo.attributes.position.array;
    for (var p = 0; p < 300; p++) {
      var j = p * 3;
      dp[j] += _dustVel[j] * dt;
      dp[j + 1] += _dustVel[j + 1] * dt;
      dp[j + 2] += _dustVel[j + 2] * dt;
      if (dp[j] > 3) dp[j] = -3; else if (dp[j] < -3) dp[j] = 3;
      if (dp[j + 2] > 3) dp[j + 2] = -3; else if (dp[j + 2] < -3) dp[j + 2] = 3;
      if (dp[j + 1] > 2.6) dp[j + 1] = 0.1; else if (dp[j + 1] < 0.1) dp[j + 1] = 2.6;
    }
    _dustGeo.attributes.position.needsUpdate = true;
    _dust.position.set(G.player.x * C.TILE3D, 0, G.player.y * C.TILE3D);
  }

  // Dust-burst particles: rise, spread, fade.
  if (_burst && _burstLife > 0) {
    _burstLife -= dt;
    var bp = _burst.geo.attributes.position.array;
    for (var q = 0; q < 48; q++) {
      var m3 = q * 3;
      bp[m3] += _burstVel[m3] * dt;
      bp[m3 + 1] += _burstVel[m3 + 1] * dt;
      bp[m3 + 2] += _burstVel[m3 + 2] * dt;
      _burstVel[m3 + 1] *= (1 - dt * 2);   // settle
    }
    _burst.geo.attributes.position.needsUpdate = true;
    _burst.mat.opacity = 0.5 * Math.max(0, _burstLife / _burstMax);
    if (_burstLife <= 0) _burstPts.visible = false;

  _flickFrame++;

    var lvl = (playing && _flickNear) ? _flickLvl : 0;

}

function _snapCamera() {
  var p = G.player;
  W3.camera.position.set(p.x * C.TILE3D, _eyeH, p.y * C.TILE3D);
  W3.camera.rotation.y = p.yaw;
  W3.camera.rotation.x = p.pitch;

// -------------------------------------------------------- updatePlayer3D
// Circle (tile units) vs wall-tile AABB.
function _collidesAt(cx, cy, r) {
  var x0 = Math.floor(cx - r), x1 = Math.floor(cx + r);
  var y0 = Math.floor(cy - r), y1 = Math.floor(cy + r);
  for (var ty = y0; ty <= y1; ty++) {
    for (var tx = x0; tx <= x1; tx++) {
      if (!_inBounds(tx, ty) || G.grid[ty][tx] === 1) {
        var nx = Math.max(tx, Math.min(cx, tx + 1));
        var ny = Math.max(ty, Math.min(cy, ty + 1));
        var dx = cx - nx, dy = cy - ny;
        if (dx * dx + dy * dy < r * r) return true;
      }
    }
  }
  return false;
}

// Shared "entered a new tile" logic: noise + step sfx + pickup + exit.
function _onTileEnter(tx, ty) {
  var p = G.player;
  var nr, ns;
  if (p.sprinting) { nr = C.SPRINT_NOISE_R; ns = C.SPRINT_SUSP; }
  else if (p.quiet) { nr = C.Q_NOISE_R; ns = C.Q_SUSP; }
  else { nr = C.P_NOISE_R; ns = C.P_SUSP; }
  if (typeof emitNoise === 'function') emitNoise(tx, ty, nr, ns);
  if (typeof Sfx !== 'undefined' && Sfx.step) Sfx.step(p.quiet, p.sprinting);

  for (var i = 0; i < G.keycards.length; i++) {
    var kc = G.keycards[i];
    if (!kc.taken && kc.x === tx && kc.y === ty) {
      kc.taken = true;
      G.keys++;
      if (typeof Sfx !== 'undefined' && Sfx.pickup) Sfx.pickup();
      // v3: per-keycard escalation — the creature gets angrier.
      G.angerFlash = 3;
      if (typeof Sfx !== 'undefined' && Sfx.anger) Sfx.anger();
      if (G.keys === C.KEYS_NEED) {
        G.exit.open = true;
        if (typeof Sfx !== 'undefined' && Sfx.unlock) Sfx.unlock();
      }
      break;
    }
  }

  if (tx === G.exit.x && ty === G.exit.y && G.exit.open) {
    G.state = 'WIN';
    if (typeof Sfx !== 'undefined' && Sfx.win) Sfx.win();
  }
}

function updatePlayer3D(dt) {
  var p = G.player;
  p.quiet = !!(_held['ShiftLeft'] || _held['ShiftRight']) || p.crouch;

  // Movement input relative to yaw. yaw=0 faces -z (north).
  var f = 0, s = 0;
  if (_held['KeyW'] || _held['ArrowUp']) f += 1;
  if (_held['KeyS'] || _held['ArrowDown']) f -= 1;
  if (_held['KeyD'] || _held['ArrowRight']) s += 1;
  if (_held['KeyA'] || _held['ArrowLeft']) s -= 1;
  var moving = (f !== 0 || s !== 0);
  p.moving = moving;

  if (moving) {
    var sy = Math.sin(p.yaw), cy = Math.cos(p.yaw);
    var dx = (-sy) * f + cy * s;      // forward(-sin,-cos) + right(cos,-sin)
    var dz = (-cy) * f + (-sy) * s;
    var len = Math.sqrt(dx * dx + dz * dz);
    if (len > 0) { dx /= len; dz /= len; }
    // v3 sprint: double-tap-hold a move key. Sprint breaks quiet (loud!).
    var wantSprint = !!_sprintCode && !!_held[_sprintCode] && !p.quiet &&
                     !p.crouch && G.stamina > 0;
    p.sprinting = wantSprint;
    if (!wantSprint) _sprintCode = null;
    var spd = (p.sprinting ? C.SPRINT_SPEED :
               p.quiet ? C.Q_SPEED : C.P_SPEED) * C.TILE3D; // world units/sec
    var r = C.P_RADIUS / C.TILE3D;                          // tiles
    var nx = p.x + (dx * spd * dt) / C.TILE3D;
    var nz = p.y + (dz * spd * dt) / C.TILE3D;
    if (!_collidesAt(nx, p.y, r)) p.x = nx;   // axis-separated slide
    if (!_collidesAt(p.x, nz, r)) p.y = nz;
    p.stillT = 0;
    p.hidden = false;

    // Facing (tile dirs) follows yaw for the throw action.
    var fwx = -sy, fwz = -cy;
    if (Math.abs(fwx) >= Math.abs(fwz)) { p.faceX = fwx >= 0 ? 1 : -1; p.faceY = 0; }
    else { p.faceX = 0; p.faceY = fwz >= 0 ? 1 : -1; }

    var tx = Math.floor(p.x), ty = Math.floor(p.y);
    if (tx !== _curTileX || ty !== _curTileY) {
      _curTileX = tx; _curTileY = ty;
      _onTileEnter(tx, ty);
    }
  } else {
    p.stillT += dt;
    p.hidden = p.stillT >= C.HIDE_T;
    p.sprinting = false;
    _sprintCode = null;
  }

  // v3 stamina: drain while sprinting, regen otherwise. Below PANT_BELOW
  // the player pants audibly — periodic noise even when standing still.
  if (p.sprinting) {
    G.stamina = Math.max(0, G.stamina - C.STAM_DRAIN * dt);
    if (G.stamina <= 0) { p.sprinting = false; _sprintCode = null; }
  } else {
    G.stamina = Math.min(C.STAM_MAX, G.stamina + C.STAM_REGEN * dt);
  }
  if (G.stamina < C.PANT_BELOW) {
    G.pantT += dt;
    if (G.pantT >= C.PANT_EVERY) {
      G.pantT = 0;
      if (typeof emitNoise === 'function')
        emitNoise(Math.floor(p.x), Math.floor(p.y), C.PANT_NOISE_R, C.PANT_SUSP);
      if (typeof Sfx !== 'undefined' && Sfx.pant) Sfx.pant();
    }

  }

  var targetH = p.crouch ? C.CROUCH_H : C.EYE_H;
  _eyeH += (targetH - _eyeH) * Math.min(1, dt * 8);
  if (Math.abs(targetH - _eyeH) < 0.001) _eyeH = targetH;

  _snapCamera();
}

// ------------------------------------------------------------- render3D
function render3D() {
  if (!W3.renderer) return;
  var now = (typeof performance !== 'undefined') ? performance.now() : 0;
  var dtR = _lastRender ? Math.min(0.1, Math.max(0, (now - _lastRender) / 1000)) : 0.016;
  _lastRender = now;

  // Lab environment: flicker clock, room lights, hunt wash, reveal beat,
  // dust drift, dust bursts, tube buzz — all on fixed-rate clocks.
  _labTick(dtR);

  // Per-tile sonar reveal lighting. Freshly stamped tiles glow sonar-ice and
  // fade out over the last 0.8s of the reveal window; everything else rests
  // at near-black.
  // Guard: floorMats is built by buildMaze3D on level start; render3D also
  // runs on TITLE/HOWTO before any level exists.
  var _matsReady = W3.floorMats.length && W3.floorMats[0] && W3.floorMats[0].length;
  var T = C.SONAR_REVEAL_T, FADE = 0.8, ICE = 0x9fd8e8;
  for (var y = 0; _matsReady && y < C.H; y++) {
    for (var x = 0; x < C.W; x++) {
      var age = G.time - G.reveal[y * C.W + x];
      var fm = W3.floorMats[y][x];
      var wm = W3.wallMats[y][x];
      if (age < T) {
        var k = 1;
        if (age > T - FADE) k = Math.max(0, (T - age) / FADE);
        var e = 0.9 * k;
        fm.emissive.setHex(ICE); fm.emissiveIntensity = e;
        if (wm) { wm.emissive.setHex(ICE); wm.emissiveIntensity = e; }
      } else if (fm.emissiveIntensity !== 0) {
        fm.emissiveIntensity = 0;
        if (wm) wm.emissiveIntensity = 0;
      }
    }
  }

  // The camera light breathes almost imperceptibly — the dark never sits still.
  if (W3.playerLight) {
    W3.playerLight.intensity = 0.45 + 0.05 * Math.sin(G.time * 7);
  }

  // Dynamic visuals owned by systems.js (guarded — load order independent).
  if (typeof syncKeycards3D === 'function') syncKeycards3D(dtR);
  if (typeof syncExit3D === 'function') syncExit3D(dtR);
  if (typeof syncRadios3D === 'function') syncRadios3D(dtR);
  if (typeof syncNotes3D === 'function') syncNotes3D(dtR);
  if (typeof updateRings3D === 'function') updateRings3D(dtR);

  W3.renderer.render(W3.scene, W3.camera);
}

// ---------------------------------------------------------------- input
function _bindPointerLock() {
  var cv = W3.renderer.domElement;
  cv.addEventListener('click', function () {
    _ensureAudio();
    if (G.state !== 'PLAY') return;
    if (document.pointerLockElement === cv) {
      // Click while locked = throw in facing direction.
      if (typeof throwFacing3D === 'function') throwFacing3D();
    } else {
      try {
        var pr = cv.requestPointerLock();
        if (pr && pr.catch) pr.catch(function () {});
      } catch (err) { /* headless / denied: keyboard still works */ }
    }
  });

  document.addEventListener('mousemove', function (e) {
    if (document.pointerLockElement !== cv || G.state !== 'PLAY') return;
    var p = G.player;
    p.yaw -= (e.movementX || 0) * 0.0022;
    p.pitch -= (e.movementY || 0) * 0.0022;
    if (p.pitch > 1.45) p.pitch = 1.45;
    if (p.pitch < -1.45) p.pitch = -1.45;

  document.addEventListener('pointerlockchange', function () {
    // Esc exits pointer lock natively — treat that as a pause.
    if (document.pointerLockElement !== cv && G.state === 'PLAY') {

    }
  });
}

var _MOVE_CODES = {
  ArrowUp: 1, ArrowDown: 1, ArrowLeft: 1, ArrowRight: 1,
  KeyW: 1, KeyA: 1, KeyS: 1, KeyD: 1,
  ShiftLeft: 1, ShiftRight: 1,

// v3: double-tap-hold sprint detection (Shift stays quiet — core mechanic).
var _lastTapCode = null, _lastTapT = 0, _sprintCode = null;

document.addEventListener('keydown', function (e) {

      code === 'ArrowLeft' || code === 'ArrowRight') {

  }

  if (!e.repeat && _MOVE_CODES[code] && code !== 'ShiftLeft' && code !== 'ShiftRight') {
    var nowT = (typeof performance !== 'undefined') ? performance.now() / 1000 : 0;

  }
  if (e.repeat) return;   // actions fire once per press; movement keys stay held

  switch (code) {
    case 'Space':

      break;
    case 'KeyF':

      if (G.state === 'PLAY') {
        if (G.noteOpen >= 0) { _closeNote3D(); }
        else if (G.nearNote >= 0 && typeof openNote3D === 'function') openNote3D(G.nearNote);
        else if (typeof throwFacing3D === 'function') throwFacing3D();
      }
      break;
    case 'KeyQ':
      if (G.state === 'PLAY' && typeof throwFacing3D === 'function') throwFacing3D();
      break;
    case 'KeyE':
      if (G.state === 'PLAY' && typeof placeRadio3D === 'function') placeRadio3D();
      break;
    case 'KeyC':

      break;
    case 'Enter':

      else if (G.state === 'HOWTO') { startIntro3D(); }
      else if (G.state === 'WIN') { initLevel3D(false); G.state = 'PLAY'; }
      break;
    case 'Escape':
      if (G.noteOpen >= 0) { _closeNote3D(); }
      else if (G.state === 'PLAY') G.state = 'PAUSE';
      else if (G.state === 'PAUSE') G.state = 'PLAY';
      break;

document.addEventListener('keyup', function (e) {

// Losing focus (alt-tab) must not leave movement keys stuck on.

});

function startIntro3D() {

  initLevel3D(false);

  G.state = 'INTRO';
