];
var _noteMeshes = [];

function buildNotes3D() {
  for (var i = 0; i < _noteMeshes.length; i++) _s_dispose(_noteMeshes[i]);
  _noteMeshes = [];
  for (var n = 0; n < NOTES.length; n++) {
    var c = _s_tileCenter(NOTES[n].x, NOTES[n].y);
    var grp = new THREE.Group();
    // A fallen lab tablet: dark slab + faint glowing screen edge.
    var slab = new THREE.Mesh(
      new THREE.BoxGeometry(0.42, 0.03, 0.3),
      new THREE.MeshLambertMaterial({ color: 0x1a1d22 })
    );
    var screen = new THREE.Mesh(
      new THREE.PlaneGeometry(0.34, 0.22),
      new THREE.MeshBasicMaterial({ color: 0x7FD4E8 })
    );
    screen.rotation.x = -Math.PI / 2;
    screen.position.y = 0.017;
    grp.add(slab);
    grp.add(screen);
    grp.position.set(c.x + 0.8, 0.06, c.z - 0.6);
    grp.rotation.y = (n * 1.3) % (Math.PI * 2);
    grp.userData.phase = n * 2.1;
    grp.userData.screenMat = screen.material;
    W3.scene.add(grp);
    _noteMeshes.push(grp);
  }
}

function syncNotes3D(dt) {
  var p = G.player, best = -1, bestD = C.NOTE_READ_R;
  for (var i = 0; i < _noteMeshes.length; i++) {
    var m = _noteMeshes[i];
    // Gentle glow pulse so notes read as interactive in the dark.
    var gl = 0.35 + 0.25 * Math.sin(G.time * 2.5 + m.userData.phase);
    m.userData.screenMat.color.setRGB(0.25 * gl, 0.55 * gl, 0.65 * gl);
    var dx = NOTES[i].x + 0.5 - p.x, dy = NOTES[i].y + 0.5 - p.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d < bestD) { bestD = d; best = i; }
  }
  G.nearNote = (G.state === 'PLAY' && G.noteOpen < 0) ? best : -1;
}

// Opened from world.js input (F, context-sensitive). Freezes the sim
// while open — reading with the creature mid-hunt is a choice, not a tax.
function openNote3D(i) {
  if (i < 0 || i >= NOTES.length) return;
  G.noteOpen = i;
  G.nearNote = -1;
  if (typeof showNote === 'function') showNote(NOTES[i].title, NOTES[i].text);
  if (typeof Sfx !== 'undefined' && Sfx.paper) Sfx.paper();
}

// Echo Chamber 3D — audio + HUD + screens + tutorial (component: audioui.js)
// Plain script: reads shared globals C, G, W3 (defined in world.js — never
// redeclared here). Declares Sfx, Tut, buildHUD, updateHUD, showScreen,
// updateScreens.
//
// ORIGINAL CODE ONLY — every line below is written fresh for this game.
// The 2D module (build/audio.js, our own code) was used as a porting
// reference for technique; all 3D graph/vocal/HUD work is new.
//
// 100% WebAudio-synthesized SFX, zero audio files, zero network requests
// (file:// safe). If AudioContext is unavailable, every method no-ops.
//
// Audio graph (per spec):
//   [osc/noise src] -> [per-voice gain] -> [PannerNode, world sounds only]
//        -> dry bus -+
//        -> wet send -> [corridor IR conv] -+
//                   -> [room IR conv] -----+-> [master gain] -> [compressor] -> out
// Player-internal sounds (heartbeat, ping attack) go dry-only.
// Autoplay: Sfx.init() creates the context and calls ctx.resume() — it is
// only ever invoked from a real user gesture (world.js wires it to canvas
// click + keydown), never at load.

const Sfx = {
  // --- persistent nodes --------------------------------------------------
  _ctx: null,
  _master: null,      // master gain (mute ramp lives here)
  _comp: null,        // DynamicsCompressor, last in chain
  _dry: null,         // dry bus
  _wetCorr: null,     // wet-send input gain -> corridor convolver
  _wetRoom: null,     // wet-send input gain -> room convolver
  _convCorr: null,
  _convRoom: null,
  _space: 'corridor', // current IR space

  _muted: false,
  _noiseBuf: null,

  // Always-on loops (gains driven per frame; sources never recreated)
  _droneGain: null,       // lab ambience bed
  _growlGain: null,       // creature growl -> creaturePanner
  _growlOsc: null,        // growl saw (pitch rises with suspicion)
  _radioGains: null,      // [g0, g1] static loops -> radio panners
  _radioPanners: null,
  _radioTickPrev: null,
  _breathGain: null,      // creature breathing -> creaturePanner
  _tubeGain: null,        // fluorescent buzz -> tube panner
  _tubePanner: null,
  _exitHumGain: null,     // exit-door hum -> exit panner
  _exitHumPanner: null,
  _exitHumOn: false,
  _heartPan: null,        // StereoPanner for heartbeat wobble (dry)

  // Persistent panners (one per entity — never per footstep)
  creaturePanner: null,
  _ambPanner: null,       // distant clangs reuse this one panner
  _creatureBus: null,     // suspicion-driven creature bus (+6 dB at max)
  _creatureWet: null,

  // --- runtime state -----------------------------------------------------
  _voices: null,          // voice-cap registry: type -> [{src, nodes}]
  _nextBeat: 0,
  _huntFlag: false,
  _cstate: null,          // last creature FSM state seen
  _stepT: 1,              // creature footstep scheduler timer
  _silenceUntil: 0,       // takenSilence() window (LOOK state)
  _suspOverride: null,    // setSuspicion01 manual override
  _clangT: 25,            // distant-clang scheduler
  _frameN: 0,             // listener-update throttle counter
  _heart01: 0,            // heartbeat intensity 0..1 (drives HUD vignette)
  _wobble: 1,             // panic-beat stereo alternator
  _behind: false,         // creature behind the player right now

  // === init ==============================================================
  // Lazy init on first user gesture. Safe to call repeatedly.
  init() {
    if (this._ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      const ctx = new AC();
      this._ctx = ctx;
      // Autoplay policy: create + resume inside the gesture handler.
      if (ctx.state === 'suspended') {
        try {
          const pr = ctx.resume();
          if (pr && pr.catch) pr.catch(function () {});
        } catch (e) {}
      }

      // Master -> compressor -> destination (safety net: -12 dB, ratio 4).
      this._master = ctx.createGain();
      this._master.gain.value = this._muted ? 0 : 0.2;
      this._comp = ctx.createDynamicsCompressor();
      this._comp.threshold.value = -12;
      this._comp.ratio.value = 4;
      this._comp.attack.value = 0.003;
      this._comp.release.value = 0.25;
      this._master.connect(this._comp);
      this._comp.connect(ctx.destination);

      // Buses.
      this._dry = ctx.createGain();
      this._dry.connect(this._master);
      this._convCorr = ctx.createConvolver();
      this._convCorr.buffer = this._makeIR(2.8, 2.2, 0.35, true);  // long dark tail
      this._convRoom = ctx.createConvolver();
      this._convRoom.buffer = this._makeIR(1.4, 2.8, 0.55, false); // short bright tail
      this._wetCorr = ctx.createGain(); this._wetCorr.gain.value = 1;
      this._wetRoom = ctx.createGain(); this._wetRoom.gain.value = 0;
      this._wetCorr.connect(this._convCorr); this._convCorr.connect(this._master);
      this._wetRoom.connect(this._convRoom); this._convRoom.connect(this._master);

      // Shared 1 s white-noise buffer (reused by every noise sound).
      const len = ctx.sampleRate;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this._noiseBuf = buf;

      // --- persistent panners --------------------------------------------
      this.creaturePanner = this._makePanner();
      this._creatureBus = ctx.createGain(); // suspicion mix bus, default unity
      this._creatureWet = ctx.createGain(); this._creatureWet.gain.value = 0.45;
      this.creaturePanner.connect(this._creatureBus);
      this._creatureBus.connect(this._dry);
      this.creaturePanner.connect(this._creatureWet);
      this._creatureWet.connect(this._wetCorr);
      this._creatureWet.connect(this._wetRoom);

      this._ambPanner = this._makePanner();
      const ambWet = ctx.createGain(); ambWet.gain.value = 0.6;
      this._ambPanner.connect(this._dry);
      this._ambPanner.connect(ambWet);
      ambWet.connect(this._wetCorr); ambWet.connect(this._wetRoom);

      this._radioPanners = [this._makePanner(), this._makePanner()];
      this._radioGains = [ctx.createGain(), ctx.createGain()];
      this._radioTickPrev = [0, 0];
      for (let i = 0; i < 2; i++) {
        const rs = ctx.createBufferSource();
        rs.buffer = buf; rs.loop = true;
        const rbp = ctx.createBiquadFilter();
        rbp.type = 'bandpass'; rbp.frequency.value = 3000; rbp.Q.value = 0.8;
        this._radioGains[i].gain.value = 0;
        const rw = ctx.createGain(); rw.gain.value = 0.35;
        rs.connect(rbp); rbp.connect(this._radioGains[i]);
        this._radioGains[i].connect(this._radioPanners[i]);
        this._radioPanners[i].connect(this._dry);
        this._radioPanners[i].connect(rw);
        rw.connect(this._wetCorr); rw.connect(this._wetRoom);
        rs.start();
      }

      this._tubePanner = this._makePanner();
      const tMix = ctx.createGain();
      const tOsc1 = ctx.createOscillator(); tOsc1.type = 'sawtooth'; tOsc1.frequency.value = 120;
      const tOsc2 = ctx.createOscillator(); tOsc2.type = 'sawtooth'; tOsc2.frequency.value = 240;
      const tOsc2g = ctx.createGain(); tOsc2g.gain.value = 0.4;
      this._tubeGain = ctx.createGain(); this._tubeGain.gain.value = 0;
      const tw = ctx.createGain(); tw.gain.value = 0.3;
      tOsc1.connect(tMix); tOsc2.connect(tOsc2g); tOsc2g.connect(tMix);
      tMix.connect(this._tubeGain); this._tubeGain.connect(this._tubePanner);
      this._tubePanner.connect(this._dry);
      this._tubePanner.connect(tw); tw.connect(this._wetCorr); tw.connect(this._wetRoom);
      tOsc1.start(); tOsc2.start();

      this._exitHumPanner = this._makePanner();
      const eMix = ctx.createGain();
      const eOsc1 = ctx.createOscillator(); eOsc1.type = 'sine'; eOsc1.frequency.value = 100;
      const eOsc2 = ctx.createOscillator(); eOsc2.type = 'sine'; eOsc2.frequency.value = 200;
      const eOsc2g = ctx.createGain(); eOsc2g.gain.value = 0.5;
      this._exitHumGain = ctx.createGain(); this._exitHumGain.gain.value = 0;
      const ew = ctx.createGain(); ew.gain.value = 0.4;
      eOsc1.connect(eMix); eOsc2.connect(eOsc2g); eOsc2g.connect(eMix);
      eMix.connect(this._exitHumGain); this._exitHumGain.connect(this._exitHumPanner);
      this._exitHumPanner.connect(this._dry);
      this._exitHumPanner.connect(ew); ew.connect(this._wetCorr); ew.connect(this._wetRoom);
      eOsc1.start(); eOsc2.start();

      // --- always-on loops -------------------------------------------------
      // Lab ambience drone: 2 detuned sines (55 + 55.7 Hz) + a faint 110 Hz
      // unease tone breathing on a ~20 s cycle -> lowpass 200 Hz. Dry bed.
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 200;
      this._droneGain = ctx.createGain(); this._droneGain.gain.value = 0.035;
      lp.connect(this._droneGain); this._droneGain.connect(this._dry);
      const droneFreqs = [55, 55.7];
      for (let i = 0; i < droneFreqs.length; i++) {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = droneFreqs[i];
        o.connect(lp); o.start();
      }
      const uOsc = ctx.createOscillator(); uOsc.type = 'sine'; uOsc.frequency.value = 110;
      const uGain = ctx.createGain(); uGain.gain.value = 0.15;
      const uLfo = ctx.createOscillator(); uLfo.type = 'sine'; uLfo.frequency.value = 0.05;
      const uLfoAmp = ctx.createGain(); uLfoAmp.gain.value = 0.12;
      uLfo.connect(uLfoAmp); uLfoAmp.connect(uGain.gain);
      uOsc.connect(uGain); uGain.connect(lp);
      uOsc.start(); uLfo.start();

      // Growl: sawtooth 65 Hz + 3 Hz LFO (+-15 Hz) -> lowpass 300 Hz.
      // Routed through the creature's panner; gain + base pitch driven per frame.
      this._growlOsc = ctx.createOscillator();
      this._growlOsc.type = 'sawtooth'; this._growlOsc.frequency.value = 65;
      const gLfo = ctx.createOscillator(); gLfo.type = 'sine'; gLfo.frequency.value = 3;
      const gLfoAmp = ctx.createGain(); gLfoAmp.gain.value = 15;
      gLfo.connect(gLfoAmp); gLfoAmp.connect(this._growlOsc.frequency);
      const gLp = ctx.createBiquadFilter(); gLp.type = 'lowpass'; gLp.frequency.value = 300;
      this._growlGain = ctx.createGain(); this._growlGain.gain.value = 0;
      this._growlOsc.connect(gLp); gLp.connect(this._growlGain);
      this._growlGain.connect(this.creaturePanner);
      this._growlOsc.start(); gLfo.start();

      // Breathing: looped noise -> bandpass 300 Hz, in/out on a 0.25 Hz LFO.
      // Gain scaled by proximity (< 6 m). Positional via creature panner.
      const bSrc = ctx.createBufferSource();
      bSrc.buffer = buf; bSrc.loop = true;
      const bBp = ctx.createBiquadFilter();
      bBp.type = 'bandpass'; bBp.frequency.value = 300; bBp.Q.value = 1.2;
      const bMod = ctx.createGain(); bMod.gain.value = 0.5;
      const bLfo = ctx.createOscillator(); bLfo.type = 'sine'; bLfo.frequency.value = 0.25;
      const bLfoAmp = ctx.createGain(); bLfoAmp.gain.value = 0.42;
      bLfo.connect(bLfoAmp); bLfoAmp.connect(bMod.gain);
      this._breathGain = ctx.createGain(); this._breathGain.gain.value = 0;
      bSrc.connect(bBp); bBp.connect(bMod); bMod.connect(this._breathGain);
      this._breathGain.connect(this.creaturePanner);
      bSrc.start(); bLfo.start();

      // Heartbeat stereo wobble panner (dry — the heartbeat is inside you).
      if (typeof ctx.createStereoPanner === 'function') {
        this._heartPan = ctx.createStereoPanner();
        this._heartPan.pan.value = 0;
        this._heartPan.connect(this._dry);
      }

      this._voices = {};
    } catch (e) { /* AudioContext unavailable — all methods no-op */ }
  },

  // === graph builders =====================================================
  // One panner per entity. HRTF, inverse falloff, 360° cones.
  _makePanner() {
    const ctx = this._ctx;
    const p = ctx.createPanner();
    p.panningModel = 'HRTF';
    p.distanceModel = 'inverse';
    p.refDistance = 1;
    p.maxDistance = 60;
    p.rolloffFactor = 1.2;
    p.coneInnerAngle = 360;
    p.coneOuterAngle = 360;
    return p;
  },

  _setPannerPos(p, x, y, z) {
    if (!p) return;
    try {
      if (p.positionX) {
        p.positionX.value = x; p.positionY.value = y; p.positionZ.value = z;
      } else if (p.setPosition) {
        p.setPosition(x, y, z);
      }
    } catch (e) {}
  },

  // Procedural impulse response: stereo decaying noise, one-pole lowpass
  // for realism. Sample-rate independent. Corridors get a ~15 ms pre-delay
  // (zeroed head) for the slap-back feel.
  _makeIR(seconds, decayPow, brightness, preDelay) {
    const ctx = this._ctx;
    const rate = ctx.sampleRate;
    const len = Math.max(1, Math.floor(rate * seconds));
    const buf = ctx.createBuffer(2, len, rate);
    const pre = preDelay ? Math.floor(rate * 0.015) : 0;
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = 0; i < len; i++) {
        const t = i / len;
        const white = Math.random() * 2 - 1;
        lp += brightness * (white - lp);
        d[i] = i < pre ? 0 : lp * Math.pow(1 - t, decayPow);
      }
    }
    return buf;
  },

  // Crossfade the wet-send amounts between corridor and room IR (0.3 s ramp).
  // Called at doorways by the world worker.
  setSpaceIR(kind) {
    const ctx = this._ctx;
    if (!ctx || !this._wetCorr) return;
    const t = ctx.currentTime;
    const corr = kind === 'room' ? 0 : 1;
    this._space = kind === 'room' ? 'room' : 'corridor';
    this._wetCorr.gain.setTargetAtTime(corr, t, 0.1);
    this._wetRoom.gain.setTargetAtTime(1 - corr, t, 0.1);
  },

  // Listener follows the camera every frame (called from frame(), throttled
  // to every other frame). Three.js is Y-up, -Z forward — maps 1:1.
  updateListener(camera) {
    const ctx = this._ctx;
    if (!ctx || !camera) return;
    try {
      const pos = camera.position;
      let fx = 0, fy = 0, fz = -1;
      if (camera.matrixWorld) {
        const me = camera.matrixWorld.elements;
        fx = -me[8]; fy = -me[9]; fz = -me[10];
      }
      const L = ctx.listener;
      if (L.positionX) {
        L.positionX.value = pos.x; L.positionY.value = pos.y; L.positionZ.value = pos.z;
        L.forwardX.value = fx; L.forwardY.value = fy; L.forwardZ.value = fz;
        L.upX.value = 0; L.upY.value = 1; L.upZ.value = 0;
      } else {
        L.setPosition(pos.x, pos.y, pos.z);
        L.setOrientation(fx, fy, fz, 0, 1, 0);
      }
    } catch (e) {}
  },

  toggleMute() {
    this._muted = !this._muted;
    try {
      if (typeof G !== 'undefined') G.muted = this._muted;
      if (this._ctx && this._master) {
        this._master.gain.setTargetAtTime(this._muted ? 0 : 0.2, this._ctx.currentTime, 0.02);
      }
    } catch (e) {}
  },

  // === voice plumbing =====================================================
  // Voice cap: max 4 concurrent instances per one-shot type; the oldest is
  // stopped. onended disconnects everything so finished nodes can GC.
  _track(type, src, nodes) {
    const arr = (this._voices[type] = this._voices[type] || []);
    while (arr.length >= 4) {
      const old = arr.shift();
      try { old.src.stop(0); } catch (e) {}
      for (let i = 0; i < old.nodes.length; i++) {
        try { old.nodes[i].disconnect(); } catch (e) {}
      }
    }
    const rec = { src: src, nodes: nodes };
    arr.push(rec);
    const self = this;
    src.onended = function () {
      for (let i = 0; i < nodes.length; i++) {
        try { nodes[i].disconnect(); } catch (e) {}
      }
      const a2 = self._voices[type];
      if (a2) {
        const ix = a2.indexOf(rec);
        if (ix >= 0) a2.splice(ix, 1);
      }
    };
  },

  // Connect a voice gain into the graph.
  // o: {panner (persistent entity panner — borrowed, never disconnected),
  //     wet (0..1 wet-send amount; 0 = dry-only)}
  // Non-panned (player-internal/centered) voices: dry + wet sends here.
  // Panned voices ride the panner's permanent dry/wet wiring.
  _voiceOut(g, o) {
    const ctx = this._ctx;
    const nodes = [g];
    if (o.panner) {
      g.connect(o.panner);
    } else {
      g.connect(this._dry);
      const wet = o.wet == null ? 0.25 : o.wet;
      if (wet > 0 && this._wetCorr && this._wetRoom) {
        const wg = ctx.createGain();
        wg.gain.value = wet;
        g.connect(wg);
        wg.connect(this._wetCorr);
        wg.connect(this._wetRoom);
        nodes.push(wg);
      }
    }
    return nodes;
  },

  // Envelope-shaped oscillator one-shot with voice cap + graph routing.
  // o: {f0, f1, dur, type, vol, delay, att, panner, wet}
  _tone3D(type, o) {
    const ctx = this._ctx;
    if (!ctx) return;
    try {
      const t = ctx.currentTime + (o.delay || 0);
      const att = o.att != null ? o.att : 0.015;
      const osc = ctx.createOscillator();
      osc.type = o.type || 'sine';
      osc.frequency.setValueAtTime(Math.max(o.f0, 1), t);
      if (o.f1 && o.f1 !== o.f0) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(o.f1, 1), t + o.dur);
      }
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(o.vol || 0.15, 0.0001), t + att);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      osc.connect(g);
      const nodes = this._voiceOut(g, o);
      nodes.unshift(osc);
      osc.start(t);
      osc.stop(t + o.dur + 0.05);
      this._track(type, osc, nodes);
    } catch (e) {}
  },

  // Filtered noise burst one-shot with voice cap + graph routing.
  // o: {dur, fType, freq, Q, vol, delay, rate, panner, wet}
  _noise3D(type, o) {
    const ctx = this._ctx;
    if (!ctx || !this._noiseBuf) return;
    try {
      const t = ctx.currentTime + (o.delay || 0);
      const src = ctx.createBufferSource();
      src.buffer = this._noiseBuf;
      src.loop = true;
      if (o.rate) src.playbackRate.value = o.rate;
      const f = ctx.createBiquadFilter();
      f.type = o.fType || 'lowpass';
      f.frequency.value = o.freq || 1000;
      if (o.Q) f.Q.value = o.Q;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(o.vol || 0.12, 0.0001), t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      src.connect(f); f.connect(g);
      const nodes = this._voiceOut(g, o);
      nodes.unshift(src, f);
      src.start(t);
      src.stop(t + o.dur + 0.05);
      this._track(type, src, nodes);
    } catch (e) {}
  },

  // One heartbeat thump (55 Hz sine), dry-only, through the wobble panner.
  _thump3D(vol, delay, pan) {
    const ctx = this._ctx;
    if (!ctx || !this._heartPan) return;
    try {
      const t = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = 55;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(vol, 0.0001), t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      osc.connect(g); g.connect(this._heartPan);
      this._heartPan.pan.setValueAtTime(pan || 0, t);
      osc.start(t); osc.stop(t + 0.2);
      this._track('heart', osc, [osc, g]);
    } catch (e) {}
  },

  // === one-shot SFX (ported from 2D, upgraded) ============================
  // Sonar ping v2: 880->620 Hz needle (5 ms attack, 0.4 s) + 6 kHz shimmer
  // + tail through the current IR at 0.6 wet + 55 Hz chest thump.
  // force=true: systems.js already checked the cooldown. Without force, a
  // press during cooldown plays the dull bonk instead.
  sonarPing3D(force) {
    const ctx = this._ctx;
    if (!ctx) return;
    if (!force && typeof G !== 'undefined' && G.pulseCd > 0) {
      this._tone3D('bonk', { f0: 180, dur: 0.08, type: 'sine', vol: 0.1, wet: 0 });
      return;
    }
    this._tone3D('ping', { f0: 880, f1: 620, dur: 0.4, type: 'sine', vol: 0.5, att: 0.005, wet: 0.6 });
    this._noise3D('ping', { dur: 0.3, fType: 'highpass', freq: 6000, vol: 0.12, delay: 0.05, wet: 0.5 });
    this._tone3D('ping', { f0: 55, dur: 0.2, type: 'sine', vol: 0.3, wet: 0 });
  },

  // Legacy name — systems.js calls Sfx.ping() on a successful pulse.
  ping() {
    this.sonarPing3D(true);
  },

  // Footstep: pitch ±15% and gain ±20% randomized every step (no robot).
  // quiet: muffled, longer; normal: bandpass 400–900 Hz.
  step(quiet, sprinting) {
    const rate = 1 + (Math.random() * 0.3 - 0.15);
    if (sprinting) {
      // v3: sprint footfalls — heavy, loud, urgent.
      this._noise3D('step', {
        dur: 0.11, fType: 'bandpass', freq: 300 + Math.random() * 400, Q: 1,
        vol: 0.2 * (0.8 + Math.random() * 0.4), rate: rate * 0.9, wet: 0.2
      });
    } else if (quiet) {
      this._noise3D('step', {
        dur: 0.12, fType: 'lowpass', freq: 500,
        vol: 0.05 * (0.8 + Math.random() * 0.4), rate: rate, wet: 0.12
      });
    } else {
      this._noise3D('step', {
        dur: 0.09, fType: 'bandpass', freq: 400 + Math.random() * 500, Q: 1,
        vol: 0.12 * (0.8 + Math.random() * 0.4), rate: rate, wet: 0.15
      });
    }
  },

  // Keycard pickup: click + two staggered sines (1320 / 1760 Hz).
  pickup() {
    this._noise3D('pickup', { dur: 0.02, fType: 'highpass', freq: 4000, vol: 0.1, wet: 0.2 });
    this._tone3D('pickup', { f0: 1320, dur: 0.08, type: 'sine', vol: 0.16, delay: 0.02, wet: 0.3 });
    this._tone3D('pickup', { f0: 1760, dur: 0.08, type: 'sine', vol: 0.16, delay: 0.09, wet: 0.3 });
  },

  // v3: escalation sting — the creature is angrier. Low snarl swell.
  anger() {
    this._tone3D('anger', { f0: 90, f1: 55, dur: 0.9, type: 'sawtooth', vol: 0.22, wet: 0.4 });
    this._noise3D('anger', { dur: 0.5, fType: 'lowpass', freq: 300, vol: 0.18, wet: 0.3, delay: 0.1 });
  },

  // v3: exhausted panting — two-phase breath (in/out), bandpassed noise.
  // Dry and close: the player hears their own body betraying them.
  pant() {
    this._noise3D('pant', { dur: 0.28, fType: 'bandpass', freq: 700, Q: 1.2, vol: 0.22, wet: 0.05 });
    this._noise3D('pant', { dur: 0.34, fType: 'bandpass', freq: 480, Q: 1.2, vol: 0.26, wet: 0.05, delay: 0.34 });
  },

  // v3: paper rustle — opening/closing a lab note.
  paper() {
    this._noise3D('paper', { dur: 0.18, fType: 'highpass', freq: 3000, vol: 0.1, wet: 0.1, rate: 0.8 + Math.random() * 0.4 });
  },

  // v3: PA announcement — garbled formant-like blips under a 220 Hz
  // carrier, as if through a dying ceiling speaker. Unintelligible by
  // design; the subtitle carries the words.
  pa() {
    for (let i = 0; i < 7; i++) {
      const f = 180 + Math.random() * 320;
      this._tone3D('pa', {
        f0: 220, dur: 0.16, type: 'sawtooth', vol: 0.1, wet: 0.5,
        delay: i * 0.22 + Math.random() * 0.05
      });
      this._tone3D('pa', {
        f0: f, dur: 0.14, type: 'square', vol: 0.05, wet: 0.5,
        delay: i * 0.22 + Math.random() * 0.05
      });
    }
    // Attention chime first: two-tone.
    this._tone3D('pa', { f0: 660, dur: 0.25, type: 'sine', vol: 0.14, wet: 0.4 });
    this._tone3D('pa', { f0: 520, dur: 0.3, type: 'sine', vol: 0.14, wet: 0.4, delay: 0.3 });
  },

  // Throw: leading whoosh, then landing clatter (3 decaying bursts).
  clatter() {
    this._noise3D('clatter', { dur: 0.25, fType: 'bandpass', freq: 800, Q: 1.5, vol: 0.1, wet: 0.3 });
    const gaps = [0.28, 0.33, 0.40];
    const vols = [0.14, 0.10, 0.06];
    for (let i = 0; i < 3; i++) {
      this._tone3D('clatter', {
        f0: 1200 + Math.random() * 1800, dur: 0.05, type: 'square',
        vol: vols[i], delay: gaps[i] + Math.random() * 0.02, wet: 0.35
      });
    }
  },

  // Invalid throw: dull 180 Hz thud, dry, quiet.
  bonk() {
    this._tone3D('bonk', { f0: 180, dur: 0.1, type: 'sine', vol: 0.25, wet: 0 });
  },

  // Radio drop: soft 90 Hz thud + short static burst.
  radioDrop() {
    this._tone3D('radioDrop', { f0: 90, dur: 0.15, type: 'sine', vol: 0.2, wet: 0.1 });
    this._noise3D('radioDrop', { dur: 0.15, fType: 'highpass', freq: 2000, vol: 0.12, wet: 0.25 });
  },

  // Exit unlock: 110 Hz swell + metallic clunk + warm fifth underneath.
  unlock() {
    this._tone3D('unlock', { f0: 110, dur: 0.8, type: 'sine', vol: 0.2, att: 0.15, wet: 0.4 });
    this._tone3D('unlock', { f0: 220, dur: 0.05, type: 'square', vol: 0.2, att: 0.005, wet: 0.3 });
    this._tone3D('unlock', { f0: 198, dur: 1.0, type: 'sine', vol: 0.08, att: 0.2, wet: 0.4 });
  },

  // Creature chitter (it heard something): 5 accelerating bandpass bursts,
  // positional through the creature's panner.
  chitter() {
    const gaps = [0, 0.07, 0.125, 0.165, 0.195];
    for (let i = 0; i < gaps.length; i++) {
      this._noise3D('chitter', {
        dur: 0.04, fType: 'bandpass', freq: 2000, Q: 8, vol: 0.18,
        delay: gaps[i], panner: this.creaturePanner
      });
    }
  },

  // Hunting sting: dissonant minor 2nd (220 + 233 Hz saws), 0.8 s swell.
  // Plays once per lock-on; flag resets when the creature leaves HUNT.
  huntSting() {
    if (this._huntFlag) return;
    this._huntFlag = true;
    this._tone3D('sting', { f0: 220, dur: 0.8, type: 'sawtooth', vol: 0.22, att: 0.3, wet: 0.2 });
    this._tone3D('sting', { f0: 233, dur: 0.8, type: 'sawtooth', vol: 0.22, att: 0.3, wet: 0.2 });
  },

  // Capture sting: dissonant cluster (110/116/123 Hz saws -> lowpass 800),
  // 1.2 s swell then cut, sub drop 55->30 Hz underneath.
  capture() {
    const ctx = this._ctx;
    if (!ctx) return;
    try {
      const t = ctx.currentTime;
      const lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 800;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.5, t + 0.6);
      g.gain.setValueAtTime(0.5, t + 1.1);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
      const oscs = [];
      const freqs = [110, 116, 123];
      for (let i = 0; i < freqs.length; i++) {
        const o = ctx.createOscillator();
        o.type = 'sawtooth'; o.frequency.value = freqs[i];
        o.connect(lp); oscs.push(o);
      }
      lp.connect(g);
      const nodes = this._voiceOut(g, { wet: 0.3 });
      nodes.unshift(lp);
      for (let i = 0; i < oscs.length; i++) nodes.unshift(oscs[i]);
      for (let i = 0; i < oscs.length; i++) { oscs[i].start(t); oscs[i].stop(t + 1.3); }
      this._track('capture', oscs[oscs.length - 1], nodes);
    } catch (e) {}
    this._tone3D('capture', { f0: 55, f1: 30, dur: 0.8, type: 'sine', vol: 0.4, wet: 0 });
  },

  // Win: warm major arpeggio (330/415/494/660) through the room IR.
  win() {
    const notes = [330, 415, 494, 660];
    for (let i = 0; i < notes.length; i++) {
      this._tone3D('win', {
        f0: notes[i], dur: 0.15, type: 'sine', vol: 0.18,
        delay: i * 0.16, wet: 0.5
      });
    }
  },

  // === creature vocals (distinct language per FSM state) ==================
  // Called on every creature state transition (frame() polls cstate, so
  // this fires even if the AI worker doesn't call it directly).
  onCreatureState(state) {
    const prev = this._cstate;
    this._cstate = state;
    const ctx = this._ctx;
    if (!ctx) return;
    this._stepT = 0.2;
    switch (state) {
      case 'LOOK':
        // Sudden 0.5 s silence, then the sniff: 3 short intakes.
        this.takenSilence();
        for (let i = 0; i < 3; i++) {
          this._noise3D('sniff', {
            dur: 0.09, fType: 'bandpass', freq: 1500, Q: 2, vol: 0.16,
            delay: 0.55 + i * 0.15, panner: this.creaturePanner
          });
        }
        break;
      case 'HUNT':
        this.huntSting();
        this._scream();
        break;
      case 'INVESTIGATE':
        this.chitter();
        break;
      case 'ROAM':
        // The lost-you cue: descending whine when a pursuit ends.
        if (prev === 'HUNT' || prev === 'SEARCH') this._lostWhine();
        break;
      default:
        break;
    }
  },

  // One creature footstep, borrowing the creature's persistent panner.
  // heavy: HUNT sub-footstep (50 Hz thump + floor shake).
  creatureStep(heavy) {
    const ctx = this._ctx;
    if (!ctx || !this.creaturePanner) return;
    if (heavy) {
      this._tone3D('cstep', {
        f0: 50, f1: 35, dur: 0.22, type: 'sine', vol: 0.5, panner: this.creaturePanner
      });
      this._noise3D('cstep', {
        dur: 0.12, fType: 'lowpass', freq: 300, vol: 0.3, panner: this.creaturePanner
      });
      if (this._behind) this.behindPulse();
    } else {
      this._noise3D('cstep', {
        dur: 0.1, fType: 'bandpass', freq: 500 + Math.random() * 200, Q: 1,
        vol: 0.14 + Math.random() * 0.06,
        rate: 1 + (Math.random() * 0.2 - 0.1),
        panner: this.creaturePanner
      });
    }
  },

  // ROAM dragging step: soft lowpassed shuffle.
  _creatureDrag() {
    if (!this._ctx || !this.creaturePanner) return;
    this._noise3D('cdrag', {
      dur: 0.2, fType: 'lowpass', freq: 200, vol: 0.1,
      rate: 0.9 + Math.random() * 0.2, panner: this.creaturePanner
    });
  },

  // ROAM pipe-knock: distant metallic knock through the corridor IR.
  _pipeKnock() {
    if (!this._ctx || !this.creaturePanner) return;
    this._tone3D('cknock', {
      f0: 180, dur: 0.15, type: 'square', vol: 0.1, att: 0.005,
      delay: Math.random() * 0.4, panner: this.creaturePanner
    });
  },

  // INVESTIGATE chirrup: questioning sine warble 1200->900 Hz, 0.4 s.
  _chirrup() {
    const ctx = this._ctx;
    if (!ctx || !this.creaturePanner) return;
    try {
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1200, t);
      osc.frequency.linearRampToValueAtTime(900, t + 0.13);
      osc.frequency.linearRampToValueAtTime(1150, t + 0.26);
      osc.frequency.linearRampToValueAtTime(950, t + 0.4);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.42);
      osc.connect(g);
      const nodes = this._voiceOut(g, { panner: this.creaturePanner });
      nodes.unshift(osc);
      osc.start(t); osc.stop(t + 0.5);
      this._track('chirrup', osc, nodes);
    } catch (e) {}
  },

  // HUNT scream: saw 300->900 Hz sweep 0.5 s + noise, loud.
  _scream() {
    if (!this._ctx || !this.creaturePanner) return;
    this._tone3D('scream', {
      f0: 300, f1: 900, dur: 0.5, type: 'sawtooth', vol: 0.4,
      att: 0.02, panner: this.creaturePanner
    });
    this._noise3D('scream', {
      dur: 0.5, fType: 'bandpass', freq: 800, Q: 1, vol: 0.25,
      panner: this.creaturePanner
    });
  },

  // Lost-you: descending whine 800->300 Hz, 1 s — the relief cue.
  _lostWhine() {
    if (!this._ctx || !this.creaturePanner) return;
    this._tone3D('whine', {
      f0: 800, f1: 300, dur: 1.0, type: 'sine', vol: 0.2,
      att: 0.05, panner: this.creaturePanner
    });
  },

  // LOOK-state silence: no creature footsteps for 0.5 s.
  takenSilence() {
    const ctx = this._ctx;
    if (!ctx) return;
    this._silenceUntil = ctx.currentTime + 0.5;
  },

  // v3 TAKEN intensification — TOTAL master-bus blackout. Used ONLY in the
  // TAKEN death timeline (never in LOOK — that beat needs its sniffs).
  // The scariest sound is absence: 0.5 s of nothing before the lunge.
  takenBlackout() {
    const ctx = this._ctx;
    if (!ctx || !this._master) return;
    try {
      const t = ctx.currentTime;
      this._master.gain.cancelScheduledValues(t);
      this._master.gain.setValueAtTime(Math.max(this._master.gain.value, 0.0001), t);
      this._master.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    } catch (e) {}
  },

  // v3 TAKEN intensification — the lunge impact. Snaps the master bus back
  // open, then ONE massive sub-bass hit (28 Hz, dry) + chest punch (55 Hz)
  // + a dry transient crack. No reverb — violence is dry.
  takenImpact() {
    const ctx = this._ctx;
    if (!ctx) return;
    const t = ctx.currentTime;
    try {
      this._master.gain.cancelScheduledValues(t);
      this._master.gain.setValueAtTime(0.0001, t);
      this._master.gain.exponentialRampToValueAtTime(this._muted ? 0.0001 : 0.2, t + 0.03);
    } catch (e) {}
    // Sub-bass: 28 Hz sine, huge, 1.1 s decay, DRY.
    this._tone3D('taken', { f0: 28, dur: 1.1, type: 'sine', vol: 0.85, wet: 0 });
    // Chest punch layered under it: 55 -> 32 Hz.
    this._tone3D('taken', { f0: 55, f1: 32, dur: 0.7, type: 'sine', vol: 0.5, wet: 0 });
    // Dry crack: violent transient, highpassed, NO reverb.
    this._noise3D('taken', { dur: 0.09, fType: 'highpass', freq: 2500, vol: 0.5, wet: 0 });
    this._noise3D('taken', { dur: 0.2, fType: 'bandpass', freq: 900, Q: 0.8, vol: 0.35, wet: 0, delay: 0.02 });
  },

  // v3: restore the master bus (called on level init / restart so a
  // blacked-out bus never leaks into the next run).
  restoreMaster() {
    const ctx = this._ctx;
    if (!ctx || !this._master) return;
    try {
      const t = ctx.currentTime;
      this._master.gain.cancelScheduledValues(t);
      this._master.gain.setValueAtTime(Math.max(this._master.gain.value, 0.0001), t);
      this._master.gain.exponentialRampToValueAtTime(this._muted ? 0.0001 : 0.2, t + 0.1);
    } catch (e) {}
  },

  // "Behind you" sub-bass pulse: 45 Hz sine, 0.15 s, dry — felt, not heard.
  behindPulse() {
    this._tone3D('bpulse', { f0: 45, dur: 0.15, type: 'sine', vol: 0.5, wet: 0 });
  },

  // Distant clang ambience: inharmonic metallic hit from a random far
  // position, through the corridor IR. The facility feels alive.
  _distantClang() {
    const ctx = this._ctx;
    if (!ctx || !this._ambPanner) return;
    const p = G.player;
    const ang = Math.random() * Math.PI * 2;
    const dTiles = 12 + Math.random() * 16;
    const wx = (p.fx + Math.cos(ang) * dTiles) * C.TILE3D;
    const wz = (p.fy + Math.sin(ang) * dTiles) * C.TILE3D;
    this._setPannerPos(this._ambPanner, wx, 1.5, wz);
    const t = ctx.currentTime;
    try {
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.0);
      const oscs = [];
      const freqs = [210, 347, 522];
      for (let i = 0; i < freqs.length; i++) {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = freqs[i] * (0.98 + Math.random() * 0.04);
        o.connect(g); oscs.push(o);
      }
      const nodes = this._voiceOut(g, { panner: this._ambPanner });
      for (let i = 0; i < oscs.length; i++) nodes.unshift(oscs[i]);
      for (let i = 0; i < oscs.length; i++) { oscs[i].start(t); oscs[i].stop(t + 2.1); }
      this._track('clang', oscs[oscs.length - 1], nodes);
    } catch (e) {}
  },

  // Radio tick: positional static burst through that radio's panner.
  _radioTick(i) {
    if (!this._ctx || !this._radioPanners) return;
    this._noise3D('rtick', {
      dur: 0.1, fType: 'bandpass', freq: 3000, Q: 0.8, vol: 0.2,
      panner: this._radioPanners[i]
    });
  },

  // === public mix/position setters ========================================
  // Breathing level 0..1 (frame() drives this from creature distance).
  setBreathLevel01(x) {
    const ctx = this._ctx;
    if (!ctx || !this._breathGain) return;
    const v = Math.max(0, Math.min(1, x || 0));
    this._breathGain.gain.setTargetAtTime(v * 0.25, ctx.currentTime, 0.15);
  },

  // Suspicion 0..1. null clears the manual override (uses G.creature.susp).
  setSuspicion01(x) {
    this._suspOverride = x == null ? null : Math.max(0, Math.min(1, x));
  },

  // Radio panner position (world units). i = 0 or 1.
  setRadioPos(i, x, y, z) {
    if (!this._radioPanners || !this._radioPanners[i]) return;
    this._setPannerPos(this._radioPanners[i], x, y, z);
  },

  // Radio static loop on/off.
  radioStatic(i, on) {
    const ctx = this._ctx;
    if (!ctx || !this._radioGains || !this._radioGains[i]) return;
    this._radioGains[i].gain.setTargetAtTime(on ? 0.08 : 0, ctx.currentTime, 0.1);
  },

  // Fluorescent tube buzz: position (world units) + flicker level 0..1.
  // The world worker calls this for the flickering tube.
  setTubeBuzz(x, y, z, level01) {
    const ctx = this._ctx;
    if (!ctx || !this._tubeGain) return;
    this._setPannerPos(this._tubePanner, x, y, z);
    const v = Math.max(0, Math.min(1, level01 || 0));
    this._tubeGain.gain.setTargetAtTime(v * 0.015, ctx.currentTime, 0.1);
  },

  // Exit-door hum: sine 100 + 200 Hz at 0.02 — an audio landmark.
  exitHum(on) {
    const ctx = this._ctx;
    this._exitHumOn = !!on;
    if (!ctx || !this._exitHumGain) return;
    const inPlay = typeof G !== 'undefined' && G.state === 'PLAY';
    this._exitHumGain.gain.setTargetAtTime(
      (this._exitHumOn && inPlay) ? 0.02 : 0, ctx.currentTime, 0.3);
  },

  // === per-frame audio ====================================================
  // Called every fixed step in PLAY. Reuses long-lived nodes; per-frame
  // writes are throttled and use setTargetAtTime smoothing.
  frame(dt) {
    const ctx = this._ctx;
    if (!ctx) return;
    try {
      const t = ctx.currentTime;
      this._frameN++;

      // Listener follows the camera, every other frame.
      if (typeof W3 !== 'undefined' && W3 && W3.camera && (this._frameN & 1) === 0) {
        this.updateListener(W3.camera);
      }

      // Outside PLAY: silence proximity layers, keep the drone bed.
      if (typeof G === 'undefined' || G.state !== 'PLAY') {
        if (this._creatureBus) this._creatureBus.gain.setTargetAtTime(0, t, 0.2);
        if (this._growlGain) this._growlGain.gain.setTargetAtTime(0, t, 0.2);
        if (this._breathGain) this._breathGain.gain.setTargetAtTime(0, t, 0.2);
        if (this._tubeGain) this._tubeGain.gain.setTargetAtTime(0, t, 0.2);
        if (this._exitHumGain) this._exitHumGain.gain.setTargetAtTime(0, t, 0.2);
        if (this._radioGains) {
          this._radioGains[0].gain.setTargetAtTime(0, t, 0.1);
          this._radioGains[1].gain.setTargetAtTime(0, t, 0.1);
        }
        if (this._droneGain) this._droneGain.gain.setTargetAtTime(0.035, t, 0.3);
        this._heart01 = 0;
        this._nextBeat = t;
        return;
      }

      const p = G.player;
      const c = G.creature;
      const T3 = C.TILE3D;
      const dx = p.fx - c.x;
      const dy = p.fy - c.y;
      const dist = Math.sqrt(dx * dx + dy * dy); // tiles, floor plane

      // Hunt-sting guard resets when the creature leaves HUNT.
      if (c.cstate !== 'HUNT') this._huntFlag = false;

      // Creature panner follows the creature (world units).
      this._setPannerPos(this.creaturePanner, c.x * T3, 1.2, c.y * T3);

      // Behind-you check: dot(camera forward, to-creature) < -0.3.
      this._behind = false;
      if (typeof W3 !== 'undefined' && W3 && W3.camera && W3.camera.matrixWorld) {
        const me = W3.camera.matrixWorld.elements;
        const fx = -me[8], fz = -me[10];
        const tx = c.x - p.fx, tz = c.y - p.fy;
        const dl = Math.sqrt(tx * tx + tz * tz);
        if (dl > 0.001) this._behind = (fx * tx + fz * tz) / dl < -0.3;
      }

      // State transitions -> vocal cues.
      if (c.cstate !== this._cstate) this.onCreatureState(c.cstate);

      // Suspicion 0..1 (manual override wins if set).
      let s01 = Math.max(0, Math.min(1, (c.susp || 0) / 100));
      if (this._suspOverride != null) s01 = this._suspOverride;

      // Mix rule: suspicion up -> creature bus +6 dB, lab ambience -6 dB.
      if (this._creatureBus) this._creatureBus.gain.setTargetAtTime(1 + s01, t, 0.2);

      // Growl: gain by proximity, pitch rises with suspicion.
      if (this._growlGain) {
        const g = dist < 8 ? 0.16 * (1 - dist / 8) : 0;
        this._growlGain.gain.setTargetAtTime(g, t, 0.15);
      }
      if (this._growlOsc) {
        this._growlOsc.frequency.setTargetAtTime(65 + 45 * s01, t, 0.3);
      }

      // Breathing: audible < 6 m, gain scaled by proximity.
      const distM = dist * T3;
      this.setBreathLevel01(distM < 6 ? 1 - distM / 6 : 0);

      // Creature vocal scheduler: distinct language per FSM state.
      this._stepT -= dt;
      const silent = t < this._silenceUntil;
      if (this._stepT <= 0 && !silent) {
        switch (c.cstate) {
          case 'ROAM':
            if (dist < 25) {
              this._stepT = 1.1 + Math.random() * 0.5;
              this._creatureDrag();
              if (Math.random() < 0.18) this._pipeKnock();
            } else {
              this._stepT = 1.0;
            }
            break;
          case 'INVESTIGATE':
            this._stepT = 0.55 + Math.random() * 0.2;
            this.creatureStep(false);
            if (Math.random() < 0.3) this._chirrup();
            break;
          case 'LOOK':
            this._stepT = 0.5; // sniff is scheduled on transition
            break;
          case 'SEARCH':
            this._stepT = 0.8;
            this.creatureStep(false);
            break;
          case 'HUNT':
            this._stepT = 0.35;
            this.creatureStep(true);
            break;
          default:
            this._stepT = 1.0;
            break;
        }
      }

      // Heartbeat: 40->120 BPM over 10->3 tiles (floor plane), lub-dub.
      // Panic < 2.5 tiles: single hard thump at 140 BPM, stereo wobble.
      const panic = dist < 2.5;
      if (dist < 10) {
        const k = Math.min(1, Math.max(0, (10 - dist) / 7));
        const bpm = panic ? 140 : 40 + 80 * k;
        const vol = panic ? 0.55 : 0.5 * k;
        this._heart01 = panic ? 1 : k;
        if (t >= this._nextBeat) {
          if (panic) {
            this._wobble = -this._wobble;
            this._thump3D(vol, 0, 0.15 * this._wobble);
          } else {
            this._thump3D(vol, 0, -0.15);        // lub, left
            this._thump3D(vol * 0.8, 0.28, 0.15); // dub, right
          }
          this._nextBeat = t + 60 / bpm;
        }
      } else {
        this._nextBeat = t;
        this._heart01 = 0;
      }

      // Drone duck: -6 dB at max suspicion, 0.015 when heartbeat > 100 BPM.
      let droneT = 0.035 * (1 - 0.5 * s01);
      if (dist < 10) {
        const k2 = Math.min(1, Math.max(0, (10 - dist) / 7));
        if (panic || 40 + 80 * k2 > 100) droneT = Math.min(droneT, 0.015);
      }
      if (this._droneGain) this._droneGain.gain.setTargetAtTime(droneT, t, 0.25);

      // Radios: positional static + tick blips from tile coords.
      for (let i = 0; i < 2; i++) {
        const r = G.radios && G.radios[i];
        this.radioStatic(i, !!r);
        if (r) {
          this.setRadioPos(i, (r.tx + 0.5) * T3, 1.0, (r.ty + 0.5) * T3);
          const prev = this._radioTickPrev[i] || 0;
          if (r.tick < prev - 1e-6) this._radioTick(i);
          this._radioTickPrev[i] = r.tick;
        } else {
          this._radioTickPrev[i] = 0;
        }
      }

      // Exit hum: keep its panner on the exit door (audio landmark).
      if (this._exitHumOn && G.exit) {
        this._setPannerPos(this._exitHumPanner, (G.exit.x + 0.5) * T3, 1.5, (G.exit.y + 0.5) * T3);
        this._exitHumGain.gain.setTargetAtTime(0.02, t, 0.3);
      }

      // Distant clangs every 20–45 s.
      this._clangT -= dt;
      if (this._clangT <= 0) {
        this._clangT = 20 + Math.random() * 25;
        this._distantClang();
      }
    } catch (e) {}
  }
};

// === tutorial =============================================================
// Same beat structure as the 2D game, copy rewritten for first-person with
// lab flavor. reset/update/text are called by main.js / world.js.
const Tut = {
  // step: 0..2 = beats 1..3 waiting on their action;
  //       3 = beat 4 waiting on G.heardFlash > 0, 4 = beat 4 showing (4 s);
  //       5 = beat 5 waiting on G.time > 25, 6 = beat 5 showing (6 s);
  //       7 = finished (text() is null forever, until reset).
  step: 0,
  _t: 0,

  reset() {
    this.step = 0;
    this._t = 0;
  },

  update(dt) {
    if (G.state !== 'PLAY') return;
    switch (this.step) {
      case 0: // beat 1: first WASD move
        if (G.player.moving) this.step = 1;
        break;
      case 1: // beat 2: first sonar pulse
        if (G.pulsesUsed > 0) this.step = 2;
        break;
      case 2: // beat 3: first keycard
        if (G.keys > 0) this.step = 3;
        break;
      case 3: // beat 4: the creature heard something (pulse heard)
        if (G.heardFlash > 0) {
          this.step = 4;
          this._t = 4;
        }
        break;
      case 4: // beat 4 showing, 4 s
        this._t -= dt;
        if (this._t <= 0) this.step = 5;
        break;
      case 5: // beat 5: late-game tip
        if (G.time > 25) {
          this.step = 6;
          this._t = 6;
        }
        break;
      case 6: // beat 5 showing, 6 s
        this._t -= dt;
        if (this._t <= 0) this.step = 7;
        break;
      default:
        break;
    }
  },

  text() {
    switch (this.step) {
      case 0:
        return "LAB 7 // WASD — MOVE · SHIFT — MOVE QUIETLY";
      case 1:
        return "SPACE — SONAR PULSE // IT MAPS THE LAB · IT HEARS YOU";
      case 2:
        return "KEYCARD " + G.keys + "/3 // RECOVER ALL THREE · REACH THE EXIT";
      case 4:
        return "!! ACOUSTIC CONTACT — IT HEARD THAT. MOVE QUIETLY.";
      case 6:
        return "Q — THROW LURE · E — DROP RADIO · STAND STILL TO HIDE";
      default:
        return null;
    }
  }
};

// Refresh every HUD element from G. Cheap: only writes the DOM when a value
// actually changed.
function updateHUD() {
  if (!_hud) return;
  const L = _hud._last;
  const inPlay = G.state === 'PLAY';

  // Keycard access badges: fill amber as collected.
  if (G.keys !== L.keys) {
    L.keys = G.keys;
    for (let i = 0; i < 3; i++) {
      _hud.diamonds[i].classList.toggle('got', i < G.keys);
    }
  }

  // Objective line (top-center, small caps): keycards found, or the exit.
  const objTxt = G.exit && G.exit.open
    ? 'REACH THE <span class="dim">EXIT</span>'
    : 'FIND KEYCARDS <span class="dim">' + G.keys + '/3</span>';
  if (objTxt !== L.obj) {
    L.obj = objTxt;
    _hud.objLine.innerHTML = objTxt;
  }

  // Sonar cooldown sweep: fraction ready (0..1) -> ring sweep + label.
  const cdFrac = C.SONAR_CD > 0 ? 1 - Math.max(0, Math.min(1, G.pulseCd / C.SONAR_CD)) : 1;
  const cdPct = Math.round(cdFrac * 100);
  if (cdPct !== L.cd) {
    L.cd = cdPct;
    _hud.sweepRing.setAttribute('stroke-dashoffset', (188.5 * (1 - cdFrac)).toFixed(1));
    _hud.sweepWrap.classList.toggle('ready', cdPct >= 100);
    _hud.sweepCenter.textContent = cdPct >= 100 ? 'GO' : Math.ceil(G.pulseCd) + 's';
  }

  // Distraction counts.
  if (G.throwsLeft !== L.th) {
    L.th = G.throwsLeft;
    _hud.throwN.textContent = '×' + G.throwsLeft;
  }
  if (G.radiosLeft !== L.ra) {
    L.ra = G.radiosLeft;
    _hud.radioN.textContent = '×' + G.radiosLeft;
  }

  // Tutorial line.
  const t = inPlay ? Tut.text() : null;
  if (t !== L.tut) {
    L.tut = t;
    _hud.tut.style.display = t ? 'block' : 'none';
    if (t) _hud.tut.textContent = t;
  }

  // Dread meter: 4 blood-red segments from suspicion 0–100 (25 each).
  let nb = 0;
  if (inPlay && G.creature) {
    const susp = Math.max(0, Math.min(100, G.creature.susp || 0));
    nb = Math.min(4, Math.ceil(susp / 25));
  }
  if (nb !== L.bands) {
    L.bands = nb;
    for (let i = 0; i < 4; i++) {
      _hud.bands[i].classList.toggle('on', i < nb);
    }
    _hud.dreadBox.classList.toggle('max', nb >= 4);
  }

  // HEARD indicator: steady red text while G.heardFlash > 0 (no blinking).
  const heardOn = inPlay && G.heardFlash > 0;
  if (heardOn !== L.heard) {
    L.heard = heardOn;
    _hud.heard.style.display = heardOn ? 'block' : 'none';
  }

  // Mute indicator.
  const muted = !!G.muted;
  if (muted !== L.mute) {
    L.mute = muted;
    _hud.mute.style.display = muted ? 'block' : 'none';
  }

  // v3: stamina bar (thin, bottom-left). Red when panting.
  const stamPct = Math.round((G.stamina || 0));
  if (stamPct !== L.stam) {
    L.stam = stamPct;
    _hud.stamFill.style.width = stamPct + '%';
    _hud.stamFill.style.background = stamPct < C.PANT_BELOW ? '#C0392B' : '#7FD4E8';
  }

  // v3: anger flash on keycard pickup ("IT IS ANGRIER").
  if (G.angerFlash > 0) G.angerFlash -= 1 / 60;
  const angerOn = inPlay && G.angerFlash > 0;
  if (angerOn !== L.anger) {
    L.anger = angerOn;
    _hud.anger.style.display = angerOn ? 'block' : 'none';
  }

  // v3: note prompt when a readable note is in range.
  const noteP = inPlay && G.nearNote >= 0 && G.noteOpen < 0;
  if (noteP !== L.notep) {
    L.notep = noteP;
    _hud.notePrompt.style.display = noteP ? 'block' : 'none';
  }

  // Red edge vignette from heartbeat intensity (max alpha 0.35).
  const heart = (typeof Sfx !== 'undefined' && Sfx._heart01) ? Sfx._heart01 : 0;
  const vig = inPlay ? Math.min(0.35, heart * 0.35) : 0;
  const vigPct = Math.round(vig * 100);
  if (vigPct !== L.vig) {
    L.vig = vigPct;
    _hud.edgeVig.style.opacity = vig.toFixed(2);
  }

  updateScreens();
}

// Show one named overlay (TITLE/HOWTO/PAUSE/WIN/LOSE), hide the rest.
// Passing 'PLAY' (or anything else) hides all overlays.
function showScreen(name) {
  if (!_hud) return;
  if (name === _screenName) return;
  _screenName = name;
  const names = ['TITLE', 'HOWTO', 'PAUSE', 'WIN', 'LOSE'];
  for (let i = 0; i < names.length; i++) {
    _hud.screens[names[i]].classList.toggle('on', names[i] === name);
  }
}

// v3: lab note readout overlay (phosphor terminal style).
function showNote(title, text) {
  if (!_hud) return;
  _hud.noteTitle.textContent = title;
  _hud.noteBody.textContent = text;
  _hud.noteOv.classList.add('on');
}
function hideNote() {
  if (!_hud) return;
  _hud.noteOv.classList.remove('on');
}

// v3: intro sequence HUD — fade from black, PA subtitle.
function showIntroHUD() {
  if (!_hud) return;
  _hud.introFade.style.opacity = '1';
  // Force reflow so the transition runs.
  void _hud.introFade.offsetWidth;
  _hud.introFade.style.opacity = '0';
}
function updateIntroHUD(t, len) {
  if (!_hud) return;
  // Keep the world hidden until the lights stutter on (~1.5s), then the
  // fade is already gone and the reveal beat carries the visuals.
  void t; void len;
}
function hideIntroHUD() {
  if (!_hud) return;
  _hud.introFade.style.opacity = '0';
  hidePASubtitle();
}
function showPASubtitle() {
  if (!_hud) return;
  _hud.paSub.innerHTML = '&#9654; PA SYSTEM: &ldquo;Attention. Containment breach in Lab 7. ' +
    'All personnel — sound discipline. It listens. Repeat — <i>it listens.</i>&rdquo;';
  _hud.paSub.style.display = 'block';
}
function hidePASubtitle() {
  if (!_hud) return;
  _hud.paSub.style.display = 'none';
}

// Sync overlays with G.state. Called from updateHUD each frame; also
// refreshes WIN/LOSE content when those screens are up.
function updateScreens() {
  if (!_hud) return;
  const s = G.state;
  if (s === 'WIN' && _screenName !== 'WIN') {
    const st = _hud.screens.WIN.querySelector('.ec3-stats');
    const secs = _fmtTime(G.totalTime > 0 ? G.totalTime : G.time);
    st.innerHTML = 'TIME&nbsp;&nbsp;' + secs +
      '<br>KEYCARDS&nbsp;&nbsp;' + G.keys + '/3' +
      '<br>SONAR PULSES&nbsp;&nbsp;' + G.pulsesUsed +
      '<br>DISTRACTIONS&nbsp;&nbsp;' + ((G.throwsUsed || 0) + (G.radiosUsed || 0)) +
      '<br>TIMES SPOTTED&nbsp;&nbsp;' + (G.timesSpotted || 0);
  }
  if (s === 'LOSE' && _screenName !== 'LOSE') {
    const cause = _hud.screens.LOSE.querySelector('.ec3-cause');
    const st = _hud.screens.LOSE.querySelector('.ec3-stats');
    const causes = {
      caught: 'It heard your pulse.',
      seen: 'It saw you move.',
      cornered: 'You walked into its path.'
    };
    cause.textContent = causes[G.loseReason] || 'It was always behind you.';
    st.innerHTML = 'KEYCARDS&nbsp;&nbsp;' + G.keys + '/3' +
      '<br>TIME SURVIVED&nbsp;&nbsp;' + _fmtTime(G.time) +
      '<br>SONAR PULSES&nbsp;&nbsp;' + G.pulsesUsed +
      '<br>TIMES SPOTTED&nbsp;&nbsp;' + (G.timesSpotted || 0);
  }
  showScreen(s);
}

/* Echo Chamber 3D — main.js (coordinator-written)
 * Boot + fixed-dt game loop. Concatenated AFTER audioui.js.
 * Plain script, no modules. References: initThree, buildCreatureMesh,
 * initLevel3D, updatePlayer3D, updateRadios, updateCreature, syncCreatureMesh,
 * checkCapture3D, Tut, Sfx, updateHUD, showScreen, buildHUD, render3D, G.
 */
'use strict';

function _playStep3D(dt) {
  G.time += dt;
  if (G.pulseCd > 0) G.pulseCd = Math.max(0, G.pulseCd - dt);
  if (G.heardFlash > 0) G.heardFlash = Math.max(0, G.heardFlash - dt);
  // v3: reading a note freezes the sim (the overlay has the player's eyes).
  if (G.noteOpen >= 0) return;
  // Freeze player input during the TAKEN death cinematic (creature.js owns the
  // 1.2s timeline via Creature.beginTaken()); everything else keeps ticking.
  if (!(typeof Creature !== 'undefined' && Creature.takenActive && Creature.takenActive())) updatePlayer3D(dt);
  updateRadios(dt);
  updateCreature(dt);
  if (typeof syncCreatureMesh === 'function') syncCreatureMesh(dt);
  checkCapture3D();
  Tut.update(dt);
  Sfx.frame(dt);
}

var _last3 = 0, _acc3 = 0, _STEP3 = 1 / 60;

function gameLoop3D(ts) {
  requestAnimationFrame(gameLoop3D);
  if (!_last3) _last3 = ts;
  var dt = (ts - _last3) / 1000;
  _last3 = ts;
  if (dt > 0.25) dt = 0.25;      // tab-switch clamp
  _acc3 += dt;
  var n = 0;
  while (_acc3 >= _STEP3 && n < 5) {
    if (G.state === 'PLAY') _playStep3D(_STEP3);
    // v3: intro sequence runs its own timeline.
    else if (G.state === 'INTRO' && typeof updateIntro3D === 'function') updateIntro3D(_STEP3);
    _acc3 -= _STEP3;
    n++;
  }
  if (n === 5) _acc3 = 0;        // spiral-of-death guard
  if (typeof updateHUD === 'function') updateHUD();
  if (typeof render3D === 'function') render3D();
}

// Boot: HUD first (DOM), then Three.js, then creature mesh. The maze's
// dynamic meshes (keycards/exit) are built by initLevel3D on game start.
(function boot3D() {
  if (typeof buildHUD === 'function') buildHUD();
  var ok = false;
  try { ok = initThree(); } catch (e) { ok = false; }
  if (ok) {
    try { buildCreatureMesh(); } catch (e) { /* mesh optional for boot */ }
    G.state = 'TITLE';
    if (typeof showScreen === 'function') showScreen('TITLE');
  }
  if (typeof requestAnimationFrame === 'function') requestAnimationFrame(gameLoop3D);
})();
</script>
</body>
